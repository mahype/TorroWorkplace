# Every key the format knows since issue #291, with valid values: the form only.
format = 1

[about]
name = "Form"
version = "2.1.0"
author = "Torro tests"
description = "Every key set once"
font = "plex"
color_scheme = "torro"
mail_view = "text"

[type.micro]
font = "numbers"
size = 11
line = 14
weight = "regular"
[type.caption]
size = 12
line = 16
weight = "medium"
[type.meta]
size = 12
line = 16
[type.body]
size = 13
line = 21
[type.body_strong]
size = 13
line = 21
weight = "medium"
[type.read]
size = 14
line = 23
[type.title]
font = "heading"
size = 16
line = 22
weight = "semibold"
[type.headline]
font = "heading"
size = 22
line = 28
weight = "semibold"
[type.display]
font = "text"
size = 28
line = 34
weight = "semibold"
[type.hero]
font = "heading"
size = 44
line = 52
