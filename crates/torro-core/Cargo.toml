[package]
name = "torro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared ground for every TorroWorkplace app: app ids, per-OS paths, accounts, theme tokens."

[lints]
workspace = true

[dependencies]
# The settings of mail accounts in `accounts.json` (task M2.1); a leaf crate of types.
torro-mail.workspace = true
keyring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# Design packs (task L.1): `design.toml`, the logos' SVG and the fonts' names – data only, never run.
roxmltree.workspace = true
toml.workspace = true
ttf-parser.workspace = true
# The fonts of the computer (#299): listed and checked to be used by name, never copied.
fontdb.workspace = true
# The provider of content from another server (issue #672, `privacy`): its registrable domain.
psl.workspace = true
# Signing in with a browser (issue #324, `ai::oauth`): PKCE's S256 challenge, base64url and the
# addresses of the authorization request and the loopback callback.
sha2.workspace = true
base64.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Qwen3-TTS as a second local voice (issue #764): only in builds that switch it on
# (`torroassistant/qwen-cuda`), since it needs an NVIDIA card and CUDA. Without it the provider
# `qwen` is refused and a file with it reads as Pocket TTS, as before.
qwen-tts = []
