tokio.workspace = true
# The system's choosers for the PDF tool's folder and logos in the settings (task WZ.6).
rfd.workspace = true
unicode-segmentation.workspace = true
webbrowser.workspace = true

[dev-dependencies]
tempfile.workspace = true
