[package]
name = "torroassistant"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The assistant of the tiled desktop: chat with the suite (mail, calendar, tasks, inbox) in an Iced window on the torroworkplace core."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }

# The built-in sound (cpal, issue #762) needs ALSA's headers to build on Linux; the release runner installs them.
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"

[dependencies]
torro-core.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
# The settings in the content area (task S.18): the host, the assistant's sections, the demo backend.
torro-settings-ui.workspace = true
# The sample answers of the demo: inbox sources, calendars, accounts.
torro-inbox.workspace = true
torro-pim.workspace = true
chrono.workspace = true
iced.workspace = true
serde_json.workspace = true
# The sound the core fetches for reading aloud (issue #745) comes as base64 in JSON lines.
base64.workspace = true
# The voice listener (`--listen`, task C.9) asks the core from a plain loop, without a window.
tokio.workspace = true
# Speech built in (issue #762): speech to text, the wake word and reading aloud with sherpa-onnx, the microphone and
# the sound output with cpal; no program is looked for on `PATH` any more.
sherpa-onnx.workspace = true
cpal.workspace = true
# The system's choosers for the PDF tool's folder and logos in the settings (task WZ.6).
rfd.workspace = true
unicode-segmentation.workspace = true
webbrowser.workspace = true

# Linux speaks the PulseAudio protocol (issue #772): PipeWire serves it through `pipewire-pulse`, so the microphones come
# with the names the volume control shows and a device another program uses can still be chosen. Pure Rust, no extra
# system package; without the socket cpal falls back to ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

[dev-dependencies]
tempfile.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
