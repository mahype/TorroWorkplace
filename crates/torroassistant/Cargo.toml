version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The assistant of the tiled desktop: chat with the suite (mail, calendar, tasks, inbox) in an Iced window on the torroworkplace core."

