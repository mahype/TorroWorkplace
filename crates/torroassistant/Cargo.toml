[package]
name = "torroassistant"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The assistant of the tiled desktop: chat with the suite (mail, calendar, tasks, inbox) in an Iced window on the torroworkplace core."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }

# sherpa-onnx-c-api.dll and onnxruntime.dll for Windows (issue #773): dist packs only binaries into the archive, so
# the DLLs go out as an asset of their own, built in dist's global job from k2-fsa's pinned archive
# (packaging/assistant_runtime.py, packaging/windows/assistant-runtime.json). The command runs in this folder.
[[package.metadata.dist.extra-artifacts]]
artifacts = [
    "../../target/assistant-runtime/torroassistant-runtime-x86_64-pc-windows-msvc.zip",
    "../../target/assistant-runtime/torroassistant-runtime-x86_64-pc-windows-msvc.zip.sha256",
]
build = ["python3", "../../packaging/assistant_runtime.py", "--output", "../../target/assistant-runtime"]

# The built-in sound (cpal, issue #762) needs ALSA's headers to build on Linux; the release runner installs them.
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"

[dependencies]
torro-core.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
# The settings in the content area (task S.18): the host, the assistant's sections, the demo backend.
torro-settings-ui.workspace = true
# The sample answers of the demo: inbox sources, calendars, accounts.
torro-inbox.workspace = true
torro-pim.workspace = true
# The content cards (issue #784): the mail, draft and contact a card shows.
torro-mail.workspace = true
torro-contacts.workspace = true
chrono.workspace = true
iced.workspace = true
serde_json.workspace = true
# The pictures of link cards (issue #785): PNG, JPEG, GIF or WebP from the core, decoded to draw.
image.workspace = true
# The sound the core fetches for reading aloud (issue #745) comes as base64 in JSON lines.
base64.workspace = true
# The voice listener (`--listen`, task C.9) asks the core from a plain loop, without a window.
tokio.workspace = true
# Speech built in (issue #762): speech to text, the wake word and reading aloud with sherpa-onnx, the microphone and
# the sound output with cpal; no program is looked for on `PATH` any more. sherpa-onnx itself is chosen per target
# below (issue #773).
# Silero VAD is checked against its SHA-256 before it loads (issue #833): a damaged file never reaches sherpa-onnx.
sha2.workspace = true
cpal.workspace = true
# The wake word heard by a model of its own (issue #765), built in; speech recognition only takes the sentence.
livekit-wakeword.workspace = true
# Echo cancellation (issue #834): the sound read aloud as the reference, taken out of the microphone.
sonora.workspace = true
# Smart Turn (issue #836): whether a sentence is over, heard in its tone; tract runs the model, rustfft its features.
tract-onnx.workspace = true
rustfft.workspace = true
# Qwen3-TTS on an NVIDIA card (issue #764), only with the feature `qwen-cuda`.
crane-core = { workspace = true, optional = true }
# The system's choosers for the PDF tool's folder and logos in the settings (task WZ.6).
rfd.workspace = true
unicode-segmentation.workspace = true
webbrowser.workspace = true

# Linux speaks the PulseAudio protocol (issue #772): PipeWire serves it through `pipewire-pulse`, so the microphones come
# with the names the volume control shows and a device another program uses can still be chosen. Pure Rust, no extra
# system package; without the socket cpal falls back to ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

# sherpa-onnx linked into the program on Linux and macOS.
[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = { workspace = true, features = ["static"] }

# Windows (issue #773): sherpa-onnx as a DLL. k2-fsa builds its static Windows libraries only against the static C
# runtime (`static-MT`), which would force `+crt-static` on every program of the suite. With `shared`, only the
# assistant needs `sherpa-onnx-c-api.dll` and `onnxruntime.dll` beside its program (both carry their own C runtime,
# so the program links with the dynamic C runtime of `cargo build` and the static one of dist's release alike);
# the build copies them next to the program in `target/`, the release ships them as
# `torroassistant-runtime-<target>.zip` (`packaging/assistant_runtime.py`).
[target.'cfg(windows)'.dependencies]
sherpa-onnx = { workspace = true, features = ["shared"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Qwen3-TTS as a second local voice through Crane on an NVIDIA card (issue #764): builds it in and switches on
# `torro-core/qwen-tts`. The core is built apart with `-p torroworkplace --features torro-core/qwen-tts`, never
# in the same call: Crane would switch on `serde_json/preserve_order` there too (docs/install.md). Needs the CUDA toolkit to build and its libraries to run; the releases
# are built without it.
qwen-cuda = ["dep:crane-core", "crane-core/cuda", "torro-core/qwen-tts"]

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
