[package]
name = "torrotasks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tasks for the tiled desktop: Nextcloud/CalDAV to-dos in an Iced window on the torroworkplace core."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }

[dependencies]
torro-core.workspace = true
torro-pim.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
# The settings in the content area (task S.19).
torro-settings-ui.workspace = true
chrono.workspace = true
iced.workspace = true
serde_json.workspace = true
webbrowser.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
