[package]
name = "torrochat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The chat of the tiled desktop: a contact list with presence and a window per conversation, on the torroworkplace core (Nextcloud Talk first)."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }

[dependencies]
torro-core.workspace = true
torro-chat.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
chrono.workspace = true
# `image-without-codecs`: previews of pictures, link cards and the large picture (stage 4).
iced = { workspace = true, features = ["image-without-codecs"] }
# Turns on the decoders Iced reads the previews with (PNG, JPEG, GIF, WebP), and encodes a picture
# pasted from the clipboard as PNG.
image.workspace = true
# A picture or files pasted into the composer.
arboard.workspace = true
# The system's dialogs: "Attach file" and "Save as…".
rfd.workspace = true
# The clipboard is read on a worker thread, so the window never waits for it.
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
