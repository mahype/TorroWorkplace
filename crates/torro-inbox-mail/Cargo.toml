[package]
name = "torro-inbox-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Torro Workplace Mail for the tiled desktop: the inbox's Mail window as a program of its own, with its own icon."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }
# Opens its compose window in the Notification Hub (decision 4 of issue #411).
"mahype/torro/torroinbox" = { stage = ["run"] }

[dependencies]
torro-core.workspace = true
# The inbox's code (issue #279): this program only starts it with its window kind.
torroinbox.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
