[package]
name = "torrocontacts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Contacts for the tiled desktop: address books grouped in a list, the contact in a side panel, on the torroworkplace core."

[lints]
workspace = true

# The Homebrew formula dist generates for this app brings the background service along (issue #411). `run` only:
# a dependency without a stage would be installed on the build runners instead of going into the formula.
[package.metadata.dist.dependencies.homebrew]
"mahype/torro/torroworkplace" = { stage = ["run"] }

[dependencies]
torro-core.workspace = true
torro-contacts.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
chrono.workspace = true
# `image-without-codecs`: the contacts' pictures.
iced = { workspace = true, features = ["image-without-codecs"] }
# Turns on the decoders Iced reads the pictures with, and scales a chosen picture down to JPEG.
image.workspace = true
# The system's dialog "Choose picture".
rfd.workspace = true
# The pause before a search asks the core.
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The build script runs on the host, including macOS/Linux cross builds for Windows.
[build-dependencies]
winresource.workspace = true
