[package]
name = "torrocalendar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Calendar for the tiled desktop: Nextcloud/CalDAV events in an Iced window on the torroworkplace core."

[lints]
workspace = true

[dependencies]
torro-core.workspace = true
torro-pim.workspace = true
torro-gui.workspace = true
torro-ipc.workspace = true
# The settings in the content area (task S.19).
torro-settings-ui.workspace = true
chrono.workspace = true
# The time zone of an event in the editor (task TE.7): the IANA names and their clocks, and the
# name of this computer's zone.
chrono-tz.workspace = true
iana-time-zone.workspace = true
iced.workspace = true
# Opens the links of an event's location and notes (issue #126).
webbrowser.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
