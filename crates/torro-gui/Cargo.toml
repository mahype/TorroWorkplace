[package]
name = "torro-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared Iced pieces for the TorroWorkplace apps: theme, data source, connect screen, date helpers."

[lints]
workspace = true

[dependencies]
torro-core.workspace = true
torro-pim.workspace = true
torro-ipc.workspace = true
chrono.workspace = true
# `image-without-codecs`: the small map of a place (`map`, issue #355), drawn from pixels the core sends as PNG.
iced = { workspace = true, features = ["advanced", "markdown", "image-without-codecs"] }
# The version in a bundle's `Info.plist`, to start the newest copy of the service (issue #411).
roxmltree.workspace = true
# `--demo --shots <dir>` (#492, `shots`): the views rendered in memory to PNG, without a window.
iced_test.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
# The single-instance channel of one named window (`instance::claim_named`, issue #643): the name as a hash.
sha2.workspace = true
# The 2-s poll of the chosen design (`design::Follow::subscription`) sleeps on Iced's tokio runtime.
tokio.workspace = true

# Moves the traffic lights beside the title band's buttons (U.11).
[target.'cfg(target_os = "macos")'.dependencies]
torro-appkit.workspace = true
