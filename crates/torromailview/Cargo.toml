[package]
name = "torromailview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Mail window for the tiled desktop: one mail as it was written (HTML) in the system's web view, on the torroworkplace core."

[lints]
workspace = true

[dependencies]
torro-core.workspace = true
# Only for the embedded Inter (`torro_gui::fonts`) and the check of `--design`; the window itself is no Iced window.
torro-gui.workspace = true
torro-inbox.workspace = true
torro-ipc.workspace = true
torro-mail.workspace = true
base64.workspace = true
chrono.workspace = true
tao.workspace = true
tokio.workspace = true
webbrowser.workspace = true
wry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true
