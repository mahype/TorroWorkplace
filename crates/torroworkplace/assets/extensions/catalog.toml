# The built-in catalog of MCP servers (issue #302, task MA.2). Built into the core with `include_str!` and checked
# by `src/extensions/catalog.rs` (and its test that this file is valid). People install an entry in the control
# centre (MCP connections › Catalog); the core starts it as written here, without a shell.
#
# Rules for every entry:
# - `id`: `[a-z0-9-]`, 1–24 characters, starts with a letter, unique; the installed server keeps it.
# - `version`: for `npx`, `uvx` and `docker` fixed, and the arguments name it, so an update of the catalog is the
#   only way to a newer one. A program a person installs themselves (ArtCraft) has no fixed version: `version` is
#   the one the entry was tested with.
# - Nothing may ask on stdin (stdin is the MCP connection): `npx` always with `-y`, Docker with `run -i --rm`.
#   Docker gets each variable as `-e NAME` (the value comes from the environment the core gives `docker`).
# - `access` per tool: `read` changes nothing, `write` creates or changes, `delete` removes or overwrites for
#   good. A tool the server reports but this file does not name needs `delete`. The server's own hints
#   (`readOnlyHint`, `destructiveHint`) do not count.
# - `description`, `hint`: English, the control centre shows them as they are.
# - Servers that work on the person's files (issue #303) have `[server.folder]`: `read_root` and `write_root` name
#   the options that bound the server to the folder a person chose (both, or neither when the server has no bound
#   of its own and only Torro's check of the paths keeps it there). Never `--connect` or `--root` then. Per tool
#   `reads` names the arguments that are paths it reads, `target` the one it writes a new file to, and
#   `target_required` that without it the tool writes over the file it opened. `blocked` tools are never offered
#   or allowed; `blocked_commands` are commands Torro refuses inside the all-purpose tools (`ui.*` for all of
#   `ui.`). `look_in` are folders below `{ProgramFiles}` the program is looked for in besides the usual ones.
#   `commands = true` marks an all-purpose tool, which runs other tools or commands by name: only its arguments (and
#   those of tools the catalog does not name) are searched for blocked names.
#
# Looked up on 2026-10-24:
# - Time: https://github.com/modelcontextprotocol/servers/tree/main/src/time, PyPI `mcp-server-time` 2026.10.19
#   (https://pypi.org/project/mcp-server-time/), licence MIT (`pyproject.toml`). Tools from its README:
#   `get_current_time`, `convert_time`.
# - Sequential Thinking: https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking, npm
#   `@modelcontextprotocol/server-sequential-thinking` 2.0.0
#   (https://www.npmjs.com/package/@modelcontextprotocol/server-sequential-thinking), needs Node.js 24 or later
#   (`engines` in its `package.json`). Licence "SEE LICENSE IN LICENSE": the repository's LICENSE is in transition
#   from MIT to Apache-2.0 (new code Apache-2.0, older contributions MIT), hence `Apache-2.0 AND MIT`. Its one
#   tool is registered as `sequentialthinking` in `index.ts` (the README writes `sequential_thinking`). It only
#   keeps a history of thoughts for the connection, so `read`.
# - GitHub MCP Server: https://github.com/github/github-mcp-server, release v2.0.3 of 2026-10-21, image
#   `ghcr.io/github/github-mcp-server:2.0.3` (the release workflow tags `{{version}}`), licence MIT. Default
#   toolsets: context, repos, issues, pull_requests, users; tool names from the README at v2.0.3. Listed is a
#   selection; every other tool of it needs `delete`.
#
# Looked up on 2026-10-26 (issue #303, `docs/tasks/artcraft.md`): the ArtCraft apps by Storytold,
# https://github.com/storytold, each `MIT OR Apache-2.0` and `unsafe_code = "forbid"`, each with an MCP server over
# stdio (`<app>-cli mcp`) that runs without a window. Tested with WordCraft v0.11.0, DeckCraft v0.11.1, GridCraft
# v0.12.1 and PdfCraft v0.14.0; tool names from `crates/mcp/src/tools.rs` of the first three and
# `crates/automation/src/tools.rs` of PdfCraft (179 tools, `tool_search` and `tool_call` only with `--compact`,
# which Torro does not use). Where `<app>-cli` is: Linux (deb, rpm) `/usr/bin`; macOS only in the release's own
# `<app>-cli-<version>-macos-universal.zip`, not in the `.app` (the person puts it into `/usr/local/bin` or
# `~/.local/bin`); Windows `%ProgramFiles%\<App>\<app>-cli.exe`, not on the `PATH` (`look_in`).
# - WordCraft, DeckCraft and PdfCraft take one folder each with `--automation-read-root` and
#   `--automation-write-root`; without them they write anywhere. GridCraft has no bound of its own.
# - The tools that work the running app's window are blocked (`screenshot`, `click`, `key`, `ui_inspect`,
#   `pointer`, `call_app`, commands `ui.*`), and so are GridCraft's `execute_command` (paths under any key and
#   relative to its folder) and PdfCraft's JavaScript console and the tools that reach keys in the system's
#   keychain or certificate store (`sign_*`).
# - Saving without a path saves over the opened file, so the save tools need one. Tools that write several files
#   or files of names Torro does not know, the all-purpose tools (`execute`, `batch`, `run_command`, `tool_call`,
#   `command_run`, `doc_batch` …), printing and scripts need `delete`. PdfCraft's changes to the open document
#   (comments, bookmarks, form fields, removing pages) are `write`: they count once saved, as a new file.

[[server]]
id = "time"
name = "Time"
publisher = "Model Context Protocol"
license = "MIT"
url = "https://github.com/modelcontextprotocol/servers/tree/main/src/time"
description = "Tells the current time in any time zone and converts times between time zones."
version = "2026.10.19"
requires = ["uvx"]
command = "uvx"
args = ["mcp-server-time@2026.10.19"]
tools = [
    { name = "get_current_time", access = "read" },
    { name = "convert_time", access = "read" },
]

[[server]]
id = "sequential-thinking"
name = "Sequential Thinking"
publisher = "Model Context Protocol"
license = "Apache-2.0 AND MIT"
url = "https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking"
description = "Lets the model think through a problem step by step, revise steps and branch. Needs Node.js 24 or later."
version = "2.0.0"
requires = ["npx"]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@2.0.0"]
tools = [
    { name = "sequentialthinking", access = "read" },
]

[[server]]
id = "github"
name = "GitHub"
publisher = "GitHub"
license = "MIT"
url = "https://github.com/github/github-mcp-server"
description = "Reads and changes repositories, issues and pull requests on GitHub with your token. Runs in Docker."
version = "2.0.3"
requires = ["docker"]
command = "docker"
args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:2.0.3"]
tools = [
    # context, users
    { name = "get_me", access = "read" },
    { name = "search_users", access = "read" },
    # repos
    { name = "get_file_contents", access = "read" },
    { name = "list_branches", access = "read" },
    { name = "list_commits", access = "read" },
    { name = "get_commit", access = "read" },
    { name = "list_tags", access = "read" },
    { name = "list_releases", access = "read" },
    { name = "get_latest_release", access = "read" },
    { name = "search_repositories", access = "read" },
    { name = "search_code", access = "read" },
    { name = "create_branch", access = "write" },
    { name = "create_or_update_file", access = "write" },
    { name = "push_files", access = "write" },
    { name = "delete_file", access = "delete" },
    # issues
    { name = "list_issues", access = "read" },
    { name = "issue_read", access = "read" },
    { name = "search_issues", access = "read" },
    { name = "issue_write", access = "write" },
    { name = "add_issue_comment", access = "write" },
    # pull_requests
    { name = "list_pull_requests", access = "read" },
    { name = "pull_request_read", access = "read" },
    { name = "search_pull_requests", access = "read" },
    { name = "create_pull_request", access = "write" },
    { name = "update_pull_request", access = "write" },
    { name = "merge_pull_request", access = "delete" },
]

[[server.secrets]]
name = "GITHUB_PERSONAL_ACCESS_TOKEN"
hint = "A GitHub personal access token for the repositories it may use; fine-grained tokens limit it best."
url = "https://github.com/settings/personal-access-tokens/new"

[[server]]
id = "wordcraft"
name = "WordCraft"
publisher = "Storytold (ArtCraft)"
license = "MIT OR Apache-2.0"
url = "https://github.com/storytold/wordcraft/releases"
description = "Opens, reads and edits documents (.docx, .odt, .rtf, .md and more) with WordCraft, which you install yourself. Works only in the folder you choose; Torro saves changes as new files. On macOS put wordcraft-cli from the release's own zip into /usr/local/bin or ~/.local/bin."
version = "0.11.0"
experimental = true
requires = ["wordcraft-cli"]
command = "wordcraft-cli"
args = ["mcp"]
look_in = ["{ProgramFiles}/WordCraft"]
blocked = ["screenshot", "click", "key", "ui_inspect"]
blocked_commands = ["ui.*"]
tools = [
    { name = "list_commands", access = "read" },
    { name = "get_text", access = "read" },
    { name = "inspect_document", access = "read" },
    { name = "render_page", access = "read" },
    { name = "list_documents", access = "read" },
    { name = "parity", access = "read" },
    { name = "open_document", access = "read", reads = ["path"] },
    { name = "new_document", access = "write" },
    { name = "type_text", access = "write" },
    { name = "select_text", access = "write" },
    { name = "save_document", access = "write", target = "path", target_required = true },
    { name = "execute", access = "delete", commands = true },
    { name = "batch", access = "delete", commands = true },
]

[server.folder]
read_root = "--automation-read-root"
write_root = "--automation-write-root"

