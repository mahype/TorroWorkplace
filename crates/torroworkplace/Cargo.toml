[package]
name = "torroworkplace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The TorroWorkplace core: background service, tray icon, control centre TUI and one MCP server for the whole suite."

# The workspace lints, with one difference: `unsafe_code` is `deny` instead of `forbid`. `forbid`
# cannot be lifted locally, and attaching to the caller's console on Windows (`main.rs`, X.2) needs
# one FFI call behind a single `#[allow(unsafe_code)]`. Keep the rest in sync with `[workspace.lints]`
# (Cargo does not allow `workspace = true` next to overrides).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[dependencies]
torro-core.workspace = true
torro-pim.workspace = true
torro-inbox.workspace = true
torro-pim-caldav.workspace = true
torro-pim-github.workspace = true
# Nextcloud's notifications and Talk for the inbox (tasks E5.8, E5.9).
torro-nextcloud.workspace = true
# ntfy accounts and their topics for the inbox (tasks E5.12, E5.13).
torro-ntfy.workspace = true
# Mail accounts (task M2.1 sets them up for M2.2 to M3.3).
torro-mail.workspace = true
torro-mail-imap.workspace = true
torro-ipc.workspace = true
torro-tui.workspace = true
torro-wm.workspace = true
torro-setups.workspace = true
torro-gui.workspace = true
# The rows of the settings pages, shared with the apps (task S.16).
torro-settings-ui.workspace = true
iced.workspace = true
chrono.workspace = true
getrandom.workspace = true
keyring.workspace = true
notify-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
schemars.workspace = true
webbrowser.workspace = true

# Not under `[target.'cfg(windows)'.build-dependencies]`: Cargo checks that `cfg` against the host that runs the build
# script, so a cross build for Windows (cargo-xwin) would not get the crate. `build.rs` decides by the target OS.
[build-dependencies]
winresource.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
winreg.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon.workspace = true
winit.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Draws a design pack's `preview.png` through the SVG renderer in a test of the control centre.
resvg.workspace = true
# Fake AI servers (Ollama, OpenRouter) for the tests of the AI accounts (task KI.1a).
httpmock.workspace = true
# The fake IMAP server of the mail sync tests (task M2.6) speaks TLS like a real one; the client
# side trusts only the test CA of `torro-mail-imap`'s fixtures.
rustls.workspace = true
tokio-rustls.workspace = true
