[workspace]
members = [
    "crates/torro-core",
    "crates/torro-pim",
    "crates/torro-inbox",
    "crates/torro-pim-caldav",
    "crates/torro-pim-github",
    "crates/torro-nextcloud",
    "crates/torro-ntfy",
    "crates/torro-mail",
    "crates/torro-mail-imap",
    "crates/torro-mail-backup",
    "crates/torro-ipc",
    "crates/torro-wm",
    "crates/torro-setups",
    "crates/torro-tui",
    "crates/torro-gui",
    "crates/torro-settings-ui",
    "crates/torro-appkit",
    "crates/torroworkplace",
    "crates/torrotasks",
    "crates/torrocalendar",
    "crates/torroinbox",
    "crates/torro-inbox-mail",
    "crates/torro-inbox-notifications",
    "crates/torroassistant",
    "crates/torro-htmlview",
]
# Spikes are their own Cargo projects (task M9.4): their dependencies touch neither the workspace nor CI.
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TorroWorkplace contributors"]
repository = "https://github.com/mahype/TorroWorkplace"
homepage = "https://github.com/mahype/TorroWorkplace"

[workspace.dependencies]
torro-core = { path = "crates/torro-core" }
torro-pim = { path = "crates/torro-pim" }
torro-inbox = { path = "crates/torro-inbox" }
torro-pim-caldav = { path = "crates/torro-pim-caldav" }
torro-pim-github = { path = "crates/torro-pim-github" }
torro-nextcloud = { path = "crates/torro-nextcloud" }
torro-ntfy = { path = "crates/torro-ntfy" }
torro-mail = { path = "crates/torro-mail" }
torro-mail-imap = { path = "crates/torro-mail-imap" }
torro-mail-backup = { path = "crates/torro-mail-backup" }
torro-tui = { path = "crates/torro-tui" }
torro-ipc = { path = "crates/torro-ipc" }
torro-wm = { path = "crates/torro-wm" }
torro-setups = { path = "crates/torro-setups" }
torro-gui = { path = "crates/torro-gui" }
torro-settings-ui = { path = "crates/torro-settings-ui" }
torro-appkit = { path = "crates/torro-appkit" }
torro-htmlview = { path = "crates/torro-htmlview" }
# The inbox as a library (issue #279): the programs of Mail and App Feed start it with their window kind.
torroinbox = { path = "crates/torroinbox" }

chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# Time zones of events (torro-pim-caldav, TE.2): IANA names read from `TZID` and written with a `VTIMEZONE`; the
# computer's zone by name (chrono brings iana-time-zone already). Both MIT OR Apache-2.0.
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
# The desktop folder of each system for the PDF tool's files (torroworkplace, WZ.4): XDG `user-dirs.dirs` on Linux,
# the Known Folder on Windows, `~/Desktop` on macOS.
dirs = "7.0.0"
getrandom = "0.4.3"
# DNS SRV and TXT lookups for finding a mail provider's CalDAV service (torro-pim-caldav, M7.1).
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# A local HTTP server for the discovery tests (torro-pim-caldav, M7.1); only a dev-dependency.
httpmock = { version = "0.8.3", default-features = false }
# Mail (task M2.1, used from M2.2 on): MIME read and written, SMTP; IMAP is our own layer on tokio-rustls (M2.3). TLS everywhere through rustls
# with the aws-lc-rs provider reqwest already brings, never OpenSSL or native-tls: one crypto provider in the build,
# and the workspace builds alike on Linux, macOS and Windows. Roots: the system's (rustls-platform-verifier, as
# reqwest does) or Mozilla's (webpki-roots).
lettre = { version = "0.11.23", default-features = false, features = ["aws-lc-rs", "builder", "hostname", "rustls-platform-verifier", "smtp-transport", "tokio1", "tokio1-rustls"] }
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
# The HTML part of a mail, cleaned through an allow list before the core keeps or hands it out (task M8.1).
ammonia = "4.2.3"
rustls = "0.23.45"
rustls-platform-verifier = "0.7.1"
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
# Windows named pipes with a safe API for the security descriptor (torro-ipc, X.1).
interprocess = { version = "2.4.5", features = ["tokio"] }
iced ={ version = "0.14.0", features = ["canvas", "svg", "tokio"] }
keyring = "4.2.0"
# The file chooser of the compose window (torroinbox, E4.3): native on macOS and Windows, the XDG portal on Linux
# (no GTK needed), asynchronous so it never blocks the window.
rfd = "0.17.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "json", "form"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21.1"
# Bundled: builds SQLite from source, so no system library is needed on Linux, macOS or Windows.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "blob"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
webbrowser = "1.2.4"
# `data:` pictures in HTML mail (torro-htmlview, task M9.6).
base64 = "0.22.1"
# HTML mail drawn inside Iced (torro-htmlview, task M9.6, decision 9 in docs/mail.md): Blitz parses the HTML,
# Stylo resolves CSS, Taffy lays out, Parley sets text, Vello on the CPU (anyrender_vello_cpu) paints a picture Iced
# shows. Beta, so the versions are pinned exactly (docs/research.md, section 8). No default features: no SVG (the
# library refuses SVG pictures), no accessibility tree, no form widgets; blitz-net is left out on purpose (it brings
# native-tls), pictures come through the workspace's reqwest (rustls). Stylo and a few of its crates are MPL-2.0.
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["floats", "system-fonts", "text-transform-icu"] }
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false }
blitz-traits = { version = "=0.3.0-beta.3", default-features = false }
anyrender = "0.14.0"
anyrender_vello_cpu = { version = "0.18.0", features = ["multithreading"] }
# Colours, brushes and shapes of the paint calls (the versions Blitz uses): the dark recolouring wraps them.
peniko = "0.6.1"
# Only for one font context shared by all mails (the version Blitz uses).
parley = { version = "0.12.0", default-features = false, features = ["std"] }
# The mouse cursor Blitz asks for (pointer over links, text over text); the version Blitz and winit bring.
cursor-icon = "1.2.0"
# Blitz decodes pictures with `image` but turns on no decoder itself: these four, nothing else (no SVG, no TIFF).
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Writes PNG files in the example of torro-htmlview; the version `image` brings.
png = "0.18.0"
winreg = "0.56.0"
# Only used by the build scripts of the three executables (icon and version info). Without the `toml` feature:
# the values are set in `build.rs`, not read from `Cargo.toml`.
winresource = { version = "0.1.31", default-features = false }
ksni = "0.3.6"
notify-rust = "4.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Safe access to processes without `unsafe` here: the SID of the current user on Windows (torro-ipc, X.1) and
# program path and arguments of a pid (torro-setups, X.8), and the free space of a disk before and while a mail
# backup writes (`disk`, #267).
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tempfile = "3.27.0"
# Design packs (torro-core, L.1): `design.toml` is read with toml (parse and serde only, no writer); ttf-parser reads the
# family names of a pack's fonts, the version Iced's font stack already brings.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
# macOS only (torro-appkit, U.11): moves the window's traffic lights. The versions winit and rfd already bring.
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString"] }
raw-window-handle = "0.6.2"
# The tray symbol of a design pack (torroworkplace, L.3): an SVG rastered for each tray size. The version Iced 0.14
# already brings for its SVG widget; no text, system fonts or raster images: a tray symbol needs none of them.
resvg = { version = "0.45.1", default-features = false }
# GlazeWM's IPC (torro-wm): plain ws:// on 127.0.0.1, so no TLS features.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The tray on macOS and Windows: tray-icon (menus from muda) on a winit event loop; winit is
# the one iced already brings along.
tray-icon = { version = "0.26.1", default-features = false }
winit = { version = "0.30.13", default-features = false }
# The template keys on macOS and Windows (issue #243, WS.4), registered on the tray's event loop. 0.8: the same
# objc2, objc2-app-kit, windows-sys and keyboard-types as tray-icon, muda and torro-ipc already bring.
global-hotkey = { version = "0.8.0", default-features = false }
# Letters as people see them (torroassistant, issue #135): an answer appears grapheme by grapheme. The version Iced's
# text stack already brings.
unicode-segmentation = "1.13.3"
# The PDF tool of the assistant (torroworkplace, WZ.3, spike in spikes/printpdf): pulldown-cmark reads the model's
# Markdown, the core writes clean HTML from its events, printpdf's HTML layout (azul-layout) sets the pages, PNG and
# JPEG only for the template's logo. Pinned exactly: the core works around gaps of this layout version (lists,
# tables, bold, links, header and footer). Brings azul-simplecss (MPL-2.0, like Stylo above) and hyphenation
# dictionaries of every language (about 14 MB in the release binary).
printpdf = { version = "=0.12.8", features = ["html", "png", "jpeg"] }
pulldown-cmark = { version = "0.12.2", default-features = false, features = ["html"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# Win32_System_Pipes: the owner check of the pipe client in torro-ipc (X.1b).
# Win32_UI_WindowsAndMessaging: GetWindowThreadProcessId, the process of a window handle (torro-wm, X.8).
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Profile for release builds made by `dist` (see dist-workspace.toml and docs/release.md).
[profile.dist]
inherits = "release"
lto = "thin"
strip = "debuginfo"

# Debug builds with the dependencies optimized (issue #206, docs/tempo.md): Iced, wgpu, Blitz and
# SQLite draw and answer many times slower without it, and the suite runs from target/debug every
# day. The workspace's own crates stay unoptimized, so they keep full debugging.
[profile.dev.package."*"]
opt-level = 2
