[workspace]
members = [
    "crates/torro-core",
    "crates/torro-pim",
    "crates/torro-pim-caldav",
    "crates/torro-pim-github",
    "crates/torro-ipc",
    "crates/torro-wm",
    "crates/torro-setups",
    "crates/torro-tui",
    "crates/torro-gui",
    "crates/torroworkplace",
    "crates/torrotasks",
    "crates/torrocalendar",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TorroWorkplace contributors"]
repository = "https://github.com/mahype/TorroWorkplace"
homepage = "https://github.com/mahype/TorroWorkplace"

[workspace.dependencies]
torro-core = { path = "crates/torro-core" }
torro-pim = { path = "crates/torro-pim" }
torro-pim-caldav = { path = "crates/torro-pim-caldav" }
torro-pim-github = { path = "crates/torro-pim-github" }
torro-tui = { path = "crates/torro-tui" }
torro-ipc = { path = "crates/torro-ipc" }
torro-wm = { path = "crates/torro-wm" }
torro-setups = { path = "crates/torro-setups" }
torro-gui = { path = "crates/torro-gui" }

chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.4.3"
iced = { version = "0.14.0", features = ["canvas", "svg", "tokio"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "json", "form"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21.1"
schemars = { version = "1.2.2", features = ["chrono04"] }
webbrowser = "1.2.4"
ksni = "0.3.6"
notify-rust = "4.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Console"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Profile for release builds made by `dist` (see dist-workspace.toml and docs/release.md).
[profile.dist]
inherits = "release"
lto = "thin"
strip = "debuginfo"
