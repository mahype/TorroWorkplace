# Plex – the example design of the suite (task L.5, docs/design-pakete.md, "Ein Paket bauen"): more
# room and squarer corners, made for the font and colour scheme of the same name. Everything left out
# here comes from the standard design "Torro".
format = 1

[about]
name = "Plex"
version = "1.0.0"
author = "Torro"
description = "More room and squarer corners, made for IBM Plex Sans"
font = "plex"
color_scheme = "plex"

# More line height than Torro and, in IBM Plex Sans, one size up (body 14/22), because Plex is drawn
# narrower than Inter and wants room.
# Sizes here are meant for Inter (task L.20): the sizes the pack had in IBM Plex Sans, divided by the
# font's size adjustment 1.058, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11.5
line = 16
[type.meta]
size = 11.5
line = 18
[type.body]
size = 13
line = 22
[type.body_strong]
size = 13
line = 22
[type.read]
size = 14
line = 24
[type.title]
size = 16
line = 24
[type.headline]
size = 22.5
line = 30
[type.display]
size = 28.5
line = 36
[type.hero]
size = 45.5
line = 53
[type.countdown]
size = 26.5
line = 30.5

# Squarer corners than Torro, in the spirit of Plex.
[radius]
scale = [2, 4, 6, 8]

[layout]
inset = 10
page_padding = [32, 40]
panel_padding = [20, 20]
row_padding = [0, 20]
control_padding = [0, 12]
section_gap = 32
item_gap = 10

[size]
control_sm = 30
control = 34
control_lg = 40
row = 44
row_two = 56
row_sidebar = 30
row_group = 36
header = 48
sidebar = 248
hour = 56
axis = 56
