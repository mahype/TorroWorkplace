# Ribbon – inspired by Microsoft Office and its Fluent 2 design (task L.9, issue #80): small radii,
# emphasis in SemiBold, made for the font and colour scheme of the same name. Not Microsoft's name
# or logo. Everything left out here comes from the standard design "Torro".
format = 1

[about]
name = "Ribbon"
version = "1.0.0"
author = "Torro"
description = "Inspired by Microsoft Office: square corners, SemiBold emphasis"
font = "ribbon"
color_scheme = "ribbon"

# Torro's sizes in Selawik; emphasis in SemiBold.
# Sizes here are meant for Inter (task L.20): the sizes the pack had in Selawik, divided by the
# font's size adjustment 1.092, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11
line = 16
weight = "semibold"
[type.meta]
size = 11
line = 16
[type.body]
size = 12
line = 20
[type.body_strong]
size = 12
line = 20
weight = "semibold"
[type.read]
size = 13
line = 22
[type.title]
size = 14.5
line = 22
[type.headline]
size = 20
line = 28
[type.display]
size = 25.5
line = 29
[type.hero]
size = 44
line = 51.5
[type.countdown]
size = 25.5
line = 29

# Fluent's corners: 2, 4, 6, 8.
[radius]
scale = [2, 4, 6, 8]
