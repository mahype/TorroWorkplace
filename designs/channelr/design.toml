# Channelr – inspired by Slack (task L.12, issue #80): bold emphasis and rounder corners, made for
# the font and colour scheme of the same name. Not Slack's name or logo. Everything left out here
# comes from the standard design "Torro".
format = 1

[about]
name = "Channelr"
version = "1.0.0"
author = "Torro"
description = "Inspired by Slack: bold emphasis, rounder corners"
font = "channelr"
color_scheme = "channelr"

# Body 14 in Lato, as Slack; names and titles in bold.
# Sizes here are meant for Inter (task L.20): the sizes the pack had in Lato, divided by the
# font's size adjustment 1.078, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11
line = 16
weight = "bold"
[type.meta]
size = 11
line = 16
[type.body]
size = 13
line = 20
[type.body_strong]
size = 13
line = 20
weight = "bold"
[type.read]
size = 13
line = 22
[type.title]
size = 15
line = 22
weight = "bold"
[type.headline]
size = 20.5
line = 28
weight = "bold"
[type.display]
size = 26
line = 29.5
weight = "bold"
[type.hero]
size = 44.5
line = 52
weight = "bold"
[type.countdown]
size = 26
line = 29.5

[radius]
scale = [4, 6, 10, 14]
