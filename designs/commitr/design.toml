# Commitr – inspired by GitHub's Primer design (task L.7, issue #80): GitHub's base size and Primer's
# corners, made for the font and colour scheme of the same name. Not GitHub's name or logo.
# Everything left out here comes from the standard design "Torro".
format = 1

[about]
name = "Commitr"
version = "1.0.0"
author = "Torro"
description = "Inspired by GitHub: body 14, Primer's corners"
font = "commitr"
color_scheme = "commitr"

# GitHub's base size is 14 (body in Mona Sans).
# Sizes here are meant for Inter (task L.20): the sizes the pack had in Mona Sans, divided by the
# font's size adjustment 1.038, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11.5
line = 16
[type.meta]
size = 11.5
line = 16
[type.body]
size = 13.5
line = 20
[type.body_strong]
size = 13.5
line = 20
[type.read]
size = 13.5
line = 22
[type.title]
size = 15.5
line = 22
[type.headline]
size = 21
line = 28
[type.display]
size = 27
line = 31
[type.hero]
size = 46.25
line = 54
[type.countdown]
size = 27
line = 31

[size]
row_sidebar = 30

# Buttons and rows at 6, as Primer.
[radius]
scale = [4, 6, 8, 12]
