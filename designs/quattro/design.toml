# Quattro – inspired by Google Workspace and Material 3 (task L.14, issue #80): large radii, made for
# the font and colour scheme of the same name. Not Google's name or logo. Everything left out here
# comes from the standard design "Torro".
format = 1

[about]
name = "Quattro"
version = "1.0.0"
author = "Torro"
description = "Inspired by Google Workspace: Material 3's large radii"
font = "quattro"
color_scheme = "quattro"

# Body 14 in Roboto Flex.
# Sizes here are meant for Inter (task L.20): the sizes the pack had in Roboto Flex, divided by the
# font's size adjustment 1.063, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11.5
line = 16
[type.meta]
size = 11.5
line = 16
[type.body]
size = 13
line = 20
[type.body_strong]
size = 13
line = 20
[type.read]
size = 13
line = 22
[type.title]
size = 15
line = 22
[type.headline]
size = 20.5
line = 28
[type.display]
size = 26.5
line = 30.5
[type.hero]
size = 45
line = 52.5
[type.countdown]
size = 26.5
line = 30.5

[radius]
scale = [6, 10, 14, 16]
