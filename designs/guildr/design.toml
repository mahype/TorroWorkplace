# Guildr – inspired by Discord (task L.13, issue #80): round corners, made for the font and colour
# scheme of the same name. Not Discord's name or logo. Everything left out comes from "Torro".
format = 1

[about]
name = "Guildr"
version = "1.0.0"
author = "Torro"
description = "Inspired by Discord: round corners"
font = "guildr"
color_scheme = "guildr"

# Body 14 in Figtree.
# Sizes here are meant for Inter (task L.20): the sizes the pack had in Figtree, divided by the
# font's size adjustment 1.092, so they look as before in their own font. Every level is set,
# because a level left out would be the standard's, meant for Inter too.
[type.micro]
size = 11
line = 14
[type.caption]
size = 11
line = 16
[type.meta]
size = 11
line = 16
[type.body]
size = 13
line = 20
[type.body_strong]
size = 13
line = 20
[type.read]
size = 13
line = 22
[type.title]
size = 14.5
line = 22
[type.headline]
size = 20
line = 28
[type.display]
size = 25.5
line = 29
[type.hero]
size = 44
line = 51.5
[type.countdown]
size = 25.5
line = 29

[radius]
scale = [4, 6, 8, 12]
