# Solarized – after the open Solarized colour scheme (Ethan Schoonover, MIT) (task L.15, issue #80). Both of its modes, the blue accent with dark text on it.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "Solarized"
version = "1.0.0"
author = "Torro, after Solarized by Ethan Schoonover (MIT)"
description = "The Solarized colour scheme in its dark and light mode"

# The scheme's colours wherever they pass the rules; moved for contrast: the text colours (Solarized is soft by design, too soft for small text here), dark attention and error, light blue and green.
[colors.dark]
bg = "#00212B"
panel = "#002B36"
raised = "#03303C"
hover = "#05333F"
selected = "#073642"
menu = "#073642"
text = "#EEE8D5"
text_2 = "#B4BEBE"
text_3 = "#93A1A1"
line = "#93A1A11A"
line_strong = "#93A1A12E"
line_selected = "#93A1A170"
focus_ring = "#2AA198"
accent = "#268BD2"
on_accent = "#001A21"
ok = "#859900"
attention = "#C19200"
error = "#F2706B"
merged = "#6C71C4"
calendar = ["#268BD2", "#859900", "#CB4B16", "#D33682", "#6C71C4"]
night = "#00303C"

[colors.light]
bg = "#EEE8D5"
panel = "#FDF6E3"
raised = "#F7F0DC"
hover = "#F5EED9"
selected = "#EEE8D5"
menu = "#FDF6E3"
text = "#073642"
text_2 = "#3E5258"
text_3 = "#4F636A"
line = "#0736421A"
line_strong = "#0736422B"
line_selected = "#07364270"
focus_ring = "#2075B2"
accent = "#268BD2"
on_accent = "#001A21"
ok = "#6F8000"
attention = "#B58900"
error = "#DC322F"
merged = "#6C71C4"
calendar = ["#2075B2", "#6F8000", "#CB4B16", "#D33682", "#6C71C4"]
night = "#F3ECD7"

[logo]
mark = "logo.svg"
