# Edge – after the open Edge colour scheme by sainnhe (MIT), github.com/sainnhe/edge (autoload/edge.vim), task FS.2,
# issue #292. Light is its light palette, dark its default style; the blue accent, no logo of its own.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "Edge"
version = "1.0.0"
author = "Torro, after Edge by sainnhe (MIT)"
description = "The Edge colour scheme: clean greys, calm blue accent"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #758094 → #A8B1C0; error #EC7279 → #F1989D.
# Edge has no orange and no magenta: the third calendar colour is its yellow, the fourth its purple.
[colors.dark]
bg = "#2C2E34"
panel = "#33353F"
raised = "#383A44"
hover = "#3B3D47"
selected = "#40434D"
menu = "#3C3E48"
text = "#C5CDD9"
text_2 = "#B8C0CE"
text_3 = "#A8B1C0"
line = "#C5CDD912"
line_strong = "#C5CDD922"
line_selected = "#C5CDD957"
focus_ring = "#6CB6EB"
accent = "#6CB6EB"
on_accent = "#2C2E34"
ok = "#A0C980"
attention = "#DEB974"
error = "#F1989D"
merged = "#D38AEA"
calendar = ["#6CB6EB", "#A0C980", "#DEB974", "#D38AEA", "#5DBBC1"]
night = "#30323A"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #8790A0 → #5F6572; accent #5079BE → #4B75BC; attention #BE7E05 → #AD7205; error #D05858 →
# #CA4444; calendar (orange) #BE7E05 → #BC7C05.
# Edge has no orange and no magenta: the third calendar colour is its yellow, the fourth its purple.
[colors.light]
bg = "#FAFAFA"
panel = "#EEF1F4"
raised = "#EAEDF0"
hover = "#E7EAED"
selected = "#E1E4E8"
menu = "#FAFAFA"
text = "#4B505B"
text_2 = "#545965"
text_3 = "#5F6572"
line = "#4B505B14"
line_strong = "#4B505B26"
line_selected = "#4B505B5F"
focus_ring = "#4B75BC"
accent = "#4B75BC"
on_accent = "#FFFFFF"
ok = "#608E32"
attention = "#AD7205"
error = "#CA4444"
merged = "#B05CCC"
calendar = ["#5079BE", "#608E32", "#BC7C05", "#B05CCC", "#3A8B84"]
night = "#F4F5F7"
