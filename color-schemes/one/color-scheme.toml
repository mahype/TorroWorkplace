# One – after the open One Light and One Dark syntax themes (MIT), github.com/atom/atom
# (packages/one-light-syntax, packages/one-dark-syntax, styles/colors.less), task FS.3, issue #292. Light is One
# Light, dark is One Dark; the blue hue-2 as the accent, no logo of its own. The colours are hsl() in the source,
# here as hex.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "One"
version = "1.0.0"
author = "Torro, after One Dark and One Light (MIT)"
description = "The One colour scheme: One Light and One Dark, blue accent"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #5C6370 → #939AA7; error #E06C75 → #E37B83.
# One has no magenta: the fourth calendar colour is its purple (hue-3).
[colors.dark]
bg = "#282C34"
panel = "#21252B"
raised = "#262A30"
hover = "#292D33"
selected = "#2D3238"
menu = "#292D34"
text = "#ABB2BF"
text_2 = "#A0A7B4"
text_3 = "#939AA7"
line = "#ABB2BF12"
line_strong = "#ABB2BF22"
line_selected = "#ABB2BF56"
focus_ring = "#61AFEF"
accent = "#61AFEF"
on_accent = "#282C34"
ok = "#98C379"
attention = "#E5C07B"
error = "#E37B83"
merged = "#C678DD"
calendar = ["#61AFEF", "#98C379", "#D19A66", "#C678DD", "#56B6C2"]
night = "#242830"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #A0A1A7 → #5E6067; accent #4078F2 → #306DF1; error #E45649 → #DF3424; calendar (green)
# #50A14F → #4A9549.
# One has no magenta: the fourth calendar colour is its purple (hue-3).
[colors.light]
bg = "#FAFAFA"
panel = "#EAEAEB"
raised = "#E6E6E7"
hover = "#E2E2E3"
selected = "#DCDCDD"
menu = "#FAFAFA"
text = "#383A42"
text_2 = "#494B53"
text_3 = "#5E6067"
line = "#383A4214"
line_strong = "#383A4226"
line_selected = "#383A425D"
focus_ring = "#306DF1"
accent = "#306DF1"
on_accent = "#FFFFFF"
ok = "#50A14F"
attention = "#B76B01"
error = "#DF3424"
merged = "#A626A4"
calendar = ["#4078F2", "#4A9549", "#B76B01", "#A626A4", "#0184BC"]
night = "#F2F2F2"
