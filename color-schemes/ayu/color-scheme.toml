# Ayu – after the open ayu colours by Konstantin Pschera (MIT), github.com/ayu-theme/ayu-colors (themes/light.yaml,
# themes/mirage.yaml), task FS.2, issue #292. Light is ayu Light, dark is ayu Mirage; the orange and yellow
# accent, no logo of its own.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "Ayu"
version = "1.0.0"
author = "Torro, after ayu by Konstantin Pschera (MIT)"
description = "The ayu colour scheme: Light and Mirage, warm orange and yellow accent"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #707A8C → #979CA3.
# ayu has no magenta: the fourth calendar colour is its purple.
[colors.dark]
bg = "#242936"
panel = "#1F2430"
raised = "#252A35"
hover = "#292D38"
selected = "#2F333D"
menu = "#292E39"
text = "#CCCAC2"
text_2 = "#B4B5B4"
text_3 = "#979CA3"
line = "#CCCAC212"
line_strong = "#CCCAC222"
line_selected = "#CCCAC253"
focus_ring = "#FFCC66"
accent = "#FFCC66"
on_accent = "#242936"
ok = "#D5FF80"
attention = "#FFA659"
error = "#F28779"
merged = "#DFBFFF"
calendar = ["#73D0FF", "#D5FF80", "#FFA659", "#DFBFFF", "#5CCFE6"]
night = "#222733"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #828E9F → #656B73; accent #F29718 → #A96609; attention #EBA400 → #A17000; error #F07171 →
# #E92B2B; calendar (blue) #22A4E6 → #1897D7; calendar (green) #86B300 → #749B00; calendar (orange) #FA8532 → #ED6606;
# calendar (cyan) #55B4D4 → #309ABE.
# ayu has no magenta: the fourth calendar colour is its purple.
[colors.light]
bg = "#FCFCFC"
panel = "#F8F9FA"
raised = "#F4F5F6"
hover = "#F1F2F3"
selected = "#ECEDEE"
menu = "#FCFCFC"
text = "#5C6166"
text_2 = "#60666C"
text_3 = "#656B73"
line = "#5C616614"
line_strong = "#5C616626"
line_selected = "#5C616661"
focus_ring = "#A96609"
accent = "#A96609"
on_accent = "#FFFFFF"
ok = "#86B300"
attention = "#A17000"
error = "#E92B2B"
merged = "#A37ACC"
calendar = ["#1897D7", "#749B00", "#ED6606", "#A37ACC", "#309ABE"]
night = "#FAFBFB"
