# Plex – the colour scheme of the example Plex (task L.5): cool surfaces with a hint of green, a calm
# petrol accent. Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "Plex"
version = "1.0.0"
author = "Torro"
description = "Cool surfaces, petrol accent"

# Cool surfaces with a hint of green, a calm petrol accent. Status, calendar and line colours stay
# the standard's; every value below passes the contrast rules in both modes.
[colors.dark]
bg = "#0C1013"
panel = "#12171B"
raised = "#151B1F"
hover = "#171E22"
selected = "#1B2226"
menu = "#161D21"
text = "#E3E8EB"
text_2 = "#A9B4BB"
text_3 = "#86929A"
line = "#FFFFFF12"
line_strong = "#FFFFFF1C"
line_selected = "#FFFFFF4D"
focus_ring = "#FFFFFF61"
accent = "#3AA6A0"
on_accent = "#03201E"
night = "#0F1C20"

[colors.light]
bg = "#ECF0F1"
panel = "#FFFFFF"
raised = "#F6F8F9"
hover = "#E9EEF0"
selected = "#DEE5E8"
menu = "#FFFFFF"
text = "#141B1F"
text_2 = "#475359"
text_3 = "#59656C"
line = "#00000012"
line_strong = "#0000001F"
line_selected = "#00000057"
focus_ring = "#00000085"
accent = "#0C6B66"
on_accent = "#FFFFFF"
night = "#DCE6E8"

[logo]
mark = "logo.svg"
