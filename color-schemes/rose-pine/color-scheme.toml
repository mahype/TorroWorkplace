# Rosé Pine – after the open Rosé Pine palette by mvllow (MIT), github.com/rose-pine/palette, task FS.3, issue #292.
# Light is Dawn, dark is the main Rosé Pine; iris as the accent, subtle as the muted text (its muted is meant for
# disabled things), no logo of its own.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1

[about]
name = "Rosé Pine"
version = "1.0.0"
author = "Torro, after Rosé Pine by mvllow (MIT)"
description = "The Rosé Pine colour scheme: Dawn and Rosé Pine, soft iris accent"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #908CAA → #9895B2; error #EB6F92 → #EB7093.
# Rosé Pine has no green and no orange: ok is pine; the calendar is pine, foam, gold, love and rose.
[colors.dark]
bg = "#191724"
panel = "#1F1D2E"
raised = "#262435"
hover = "#2A2839"
selected = "#302E40"
menu = "#2B293A"
text = "#E0DEF4"
text_2 = "#C0BDD6"
text_3 = "#9895B2"
line = "#E0DEF412"
line_strong = "#E0DEF422"
line_selected = "#E0DEF451"
focus_ring = "#C4A7E7"
accent = "#C4A7E7"
on_accent = "#191724"
ok = "#31748F"
attention = "#F6C177"
error = "#EB7093"
merged = "#C4A7E7"
calendar = ["#31748F", "#9CCFD8", "#F6C177", "#EB6F92", "#EBBCBA"]
night = "#1C1A29"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #797593 → #6C6789; accent #907AA9 → #846B9F; attention #EA9D34 → #BC7413; error #B4637A →
# #B05B73; calendar (orange) #EA9D34 → #CC7E15; calendar (cyan) #D7827E → #D37671.
# Rosé Pine has no green and no orange: ok is pine; the calendar is pine, foam, gold, love and rose.
[colors.light]
bg = "#FAF4ED"
panel = "#FFFAF3"
raised = "#FBF6F0"
hover = "#F7F2EE"
selected = "#F2EDE9"
menu = "#FFFAF3"
text = "#575279"
text_2 = "#605B80"
text_3 = "#6C6789"
line = "#57527914"
line_strong = "#57527926"
line_selected = "#5752795F"
focus_ring = "#846B9F"
accent = "#846B9F"
on_accent = "#FFFFFF"
ok = "#286983"
attention = "#BC7413"
error = "#B05B73"
merged = "#907AA9"
calendar = ["#286983", "#56949F", "#CC7E15", "#B4637A", "#D37671"]
night = "#FCF7F0"
