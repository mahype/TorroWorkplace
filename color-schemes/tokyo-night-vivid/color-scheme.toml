# Tokyo Night Vivid – Tokyo Night with a vivid yellow accent, violet in light mode (issue #515). Surfaces, text and status colours are those of Tokyo Night;
# only accent, on_accent and focus_ring are new. The notes below on Tokyo Night (source, licence) still hold.
# Tokyo Night – after the open Tokyo Night theme by Enkia (MIT), github.com/enkia/tokyo-night-vscode-theme
# (themes/tokyo-night-color-theme.json, tokyo-night-light-color-theme.json), task FS.3, issue #292. Light is Tokyo
# Night Light, dark is Tokyo Night; the blue accent, no logo of its own. Dark text is its editor foreground
# #A9B1D6 and the muted text its comment colour #51597D.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1
vivid = true

[about]
name = "Tokyo Night Vivid"
version = "1.0.0"
author = "Torro, after Tokyo Night by Enkia (MIT)"
description = "The Tokyo Night colour scheme with a vivid yellow accent (violet in light mode)"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: text_3 #51597D → #838BAF.
[colors.dark]
bg = "#1A1B26"
panel = "#16161E"
raised = "#1B1B24"
hover = "#1E1F28"
selected = "#23242F"
menu = "#1F1F29"
text = "#A9B1D6"
text_2 = "#98A0C4"
text_3 = "#838BAF"
line = "#A9B1D612"
line_strong = "#A9B1D622"
line_selected = "#A9B1D652"
focus_ring = "#FFE500"
accent = "#FFE500"
on_accent = "#1A1B26"
ok = "#9ECE6A"
attention = "#E0AF68"
error = "#F7768E"
merged = "#9D7CD8"
calendar = ["#7AA2F7", "#9ECE6A", "#FF9E64", "#BB9AF7", "#7DCFFF"]
night = "#181822"

# The scheme's own colours: bg, panel, text, the muted text (text_3) and the accent; raised, hover, selected, menu,
# night, text_2 and the lines are derived from them, status and calendar colours come from the scheme's palette.
# Moved for contrast: panel #D6D8DF → #E1E2E7 (for the standard's category colours, which a scheme cannot set); text_3
# #707280 → #575B70.
# Vivid accent in light mode: yellow cannot carry white text on a light surface, and a dark mustard (#827400) reads olive
# and is hard to tell from `attention` (#8F5E15). So light mode takes a vivid violet (#8A3FE0) instead: white on it is 5.4:1
# and it stays 3:1 or more on panel and selected.
[colors.light]
bg = "#E6E7ED"
panel = "#E1E2E7"
raised = "#DDDEE3"
hover = "#D9DAE1"
selected = "#D3D5DC"
menu = "#E6E7ED"
text = "#343B59"
text_2 = "#444963"
text_3 = "#575B70"
line = "#343B5914"
line_strong = "#343B5926"
line_selected = "#343B595D"
focus_ring = "#8A3FE0"
accent = "#8A3FE0"
on_accent = "#FFFFFF"
ok = "#385F0D"
attention = "#8F5E15"
error = "#8C4351"
merged = "#7B43BA"
calendar = ["#2959AA", "#385F0D", "#965027", "#65359D", "#006C86"]
night = "#E3E4EA"
