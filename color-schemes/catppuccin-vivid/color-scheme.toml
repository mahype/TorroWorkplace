# Catppuccin Vivid – Catppuccin with a vivid magenta accent (issue #515). Surfaces, text and status colours are those of Catppuccin;
# only accent, on_accent and focus_ring are new. The notes below on Catppuccin (source, licence) still hold.
# Catppuccin – after the open Catppuccin colour scheme (the Catppuccin organisation, MIT) (task L.15, issue #80). Dark is Mocha, light is Latte; mauve accent.
# Everything left out here comes from the standard colour scheme "Torro".
format = 1
vivid = true

[about]
name = "Catppuccin Vivid"
version = "1.0.0"
author = "Torro, after Catppuccin by the Catppuccin organisation (MIT)"
description = "The Catppuccin colour scheme with a vivid magenta accent"

# The scheme's colours wherever they pass the rules; moved for contrast: in Latte the third text colour, the focus ring, attention, and peach and pink as calendar colours.
[colors.dark]
bg = "#181825"
panel = "#1E1E2E"
raised = "#232334"
hover = "#2A2B3C"
selected = "#313244"
menu = "#181825"
text = "#CDD6F4"
text_2 = "#BAC2DE"
text_3 = "#A6ADC8"
line = "#CDD6F412"
line_strong = "#CDD6F421"
line_selected = "#CDD6F45C"
focus_ring = "#FF4DB8"
accent = "#FF4DB8"
on_accent = "#11111B"
ok = "#A6E3A1"
attention = "#F9E2AF"
error = "#F38BA8"
merged = "#CBA6F7"
calendar = ["#89B4FA", "#A6E3A1", "#FAB387", "#F5C2E7", "#CBA6F7"]
night = "#1B1B2A"

# Vivid accent in light mode: the wanted magenta (#FF4DB8) is too bright on light surfaces, so it is darkened to #D6008A
# to keep white text on it at 4.5:1 or more and the mark (today circle, now line) at 3:1 or more on panel and selected.
[colors.light]
bg = "#E6E9EF"
panel = "#EFF1F5"
raised = "#EAEDF2"
hover = "#E4E7EE"
selected = "#DCE0E8"
menu = "#EFF1F5"
text = "#4C4F69"
text_2 = "#4C4F69"
text_3 = "#5C5F77"
line = "#4C4F6917"
line_strong = "#4C4F6929"
line_selected = "#4C4F6970"
focus_ring = "#D6008A"
accent = "#D6008A"
on_accent = "#FFFFFF"
ok = "#40A02B"
attention = "#A3600A"
error = "#D20F39"
merged = "#8839EF"
calendar = ["#1E66F5", "#3B9327", "#D6520A", "#C8549F", "#8839EF"]
night = "#E3E7EF"
