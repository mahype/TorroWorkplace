# The font Geist Mono (task SR.7, issue #299): Geist Mono. Its size adjustment comes from its x-height.
# Source: github.com/vercel/geist-font release v1.8.2 (geist-font-v1.8.2.zip, GeistMono/ttf), Version 1.802;
# downloaded 2026-10-24. Licence: SIL OFL 1.1, LICENSE.txt is the font's OFL text as published.
# Reserved Font Name: none.
# The Geist Mono files are the maker's, unchanged.
# x-height 0.530 em (OS/2 sxHeight of the Regular), so the automatic size adjustment is 1.030; widest figure
# of numbers 0.600 em, 0.618 em after it.
# Figures checked with fontTools: the ten default digits are one width in every cut (Regular 600, Medium 600,
# SemiBold 600, Bold 600 of 1000 units), so numbers keeps the text font.
format = 1
license = "OFL-1.1"
# Grouped under "Mono" in the control centre (#299).
kind = "mono"

[about]
name = "Geist Mono"
version = "1.0.0"
author = "Torro"
description = "Geist Mono: the monospace companion of Geist"

[fonts.text]
family = "Geist Mono"
regular = "GeistMono-Regular.ttf"
medium = "GeistMono-Medium.ttf"
semibold = "GeistMono-SemiBold.ttf"
bold = "GeistMono-Bold.ttf"
