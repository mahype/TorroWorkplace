# The font Noto Sans (task SR.5, issue #299): Noto Sans. Its size adjustment comes from its x-height.
# Source: github.com/notofonts/latin-greek-cyrillic release NotoSans-v2.015 (NotoSans/unhinted/ttf), Version
# 2.015; downloaded 2026-10-24. Licence: SIL OFL 1.1, LICENSE.txt is the font's OFL text as published.
# Reserved Font Name: none.
# The Noto Sans files are the maker's, unchanged.
# x-height 0.536 em (OS/2 sxHeight of the Regular), so the automatic size adjustment is 1.018; widest figure
# of numbers 0.572 em, 0.583 em after it.
# Figures checked with fontTools: the ten default digits are one width in every cut (Regular 572, Medium 572,
# SemiBold 572, Bold 572 of 1000 units), so numbers keeps the text font.
format = 1
license = "OFL-1.1"
# Grouped under "Sans" in the control centre (#299).
kind = "sans"

[about]
name = "Noto Sans"
version = "1.0.0"
author = "Torro"
description = "Noto Sans: a plain humanist sans for Latin, Greek and Cyrillic"

[fonts.text]
family = "Noto Sans"
regular = "NotoSans-Regular.ttf"
medium = "NotoSans-Medium.ttf"
semibold = "NotoSans-SemiBold.ttf"
bold = "NotoSans-Bold.ttf"
