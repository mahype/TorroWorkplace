<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail-Fenster · Übersicht statt leerer Lesefläche</title>
<!--
  Entwurf: Was rechts im Mail-Fenster steht, solange keine Mail offen ist, und wie der Pfad über der Liste
  dorthin zurückführt. Werte aus dem Standard-Design (torro-design), Beispieldaten erfunden.

  Aufrufe (für Screenshots ist das Fenster die ganze Seite):
    ?view=sheet                      Vergleichsbogen (Standard)
    ?mode=wide|open|medium|narrow    &theme=dark|light   &range=7|30|90
-->
<style>
  @font-face { font-family: Inter; src: url("../../../crates/torro-gui/assets/fonts/Inter-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: Inter; src: url("../../../crates/torro-gui/assets/fonts/Inter-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: Inter; src: url("../../../crates/torro-gui/assets/fonts/Inter-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: InterTab; src: url("../../../crates/torro-gui/assets/fonts/InterTabular-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: InterTab; src: url("../../../crates/torro-gui/assets/fonts/InterTabular-Medium.ttf"); font-weight: 500; }

  .dark {
    --bg: #08090A; --panel: #0F1011; --raised: #141518; --hover: #16171A; --selected: #1C1E22; --menu: #17181B;
    --text: #EDEEF0; --text2: #B4B8BF; --text3: #8A8F98; --line: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.10);
    --line-selected: rgba(255,255,255,.28); --scrim: rgba(0,0,0,.62); --accent: #D50C0C; --attention: #E8A33D;
    --c0: #4C8DF0; --c1: #CF8A2C; --c2: #2BA39A; --c3: #A99BD0;
    --s0: #3B78D8; --s1: #C9701E; --s2: #2E9E6B; --s3: #B5509A; --so: #5C6068;
    --shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .light {
    --bg: #F4F5F6; --panel: #FFFFFF; --raised: #F8F9FA; --hover: #F0F1F3; --selected: #E9EAED; --menu: #FFFFFF;
    --text: #18191B; --text2: #4F535A; --text3: #62666D; --line: rgba(0,0,0,.07); --line-strong: rgba(0,0,0,.11);
    --line-selected: rgba(0,0,0,.32); --scrim: rgba(0,0,0,.30); --accent: #D50C0C; --attention: #B06F12;
    --c0: #3D77CE; --c1: #B1741F; --c2: #238A82; --c3: #756990;
    --s0: #2F6BC9; --s1: #B8621A; --s2: #2A9466; --s3: #A8448C; --so: #50545B;
    --shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, sans-serif; font-size: 14px; line-height: 22px; background: #2a2b2e; }
  .tab { font-family: InterTab, Inter, sans-serif; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 14px; height: 14px; }
  svg.i.chev { width: 12px; height: 12px; color: var(--text3); }

  /* Fenster */
  .win { display: flex; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; position: relative; }
  .content { flex: 1; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); display: flex; }
  .win.narrow .content { border-left: 0; }

  /* Seitenleiste 240 / Leiste 60 */
  .sidebar { width: 240px; flex: none; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .rail { width: 60px; flex: none; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); align-items: stretch; }
  .rail .item { justify-content: center; padding: 0; }
  .rail .sep { height: 1px; background: var(--line); margin: 8px 4px; }
  .head { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 10px; }
  .rail .head { justify-content: center; padding: 0; }
  .logo { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; }
  .head .app { font-weight: 500; }
  .sp { flex: 1; }
  .ib { color: var(--text2); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 4px; flex: none; }
  .ib.boxed { border: 1px solid var(--line-strong); }
  .gtitle { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text3); height: 32px; display: flex; align-items: center; padding: 0 8px; margin-top: 12px; }
  .item { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 4px; color: var(--text2); white-space: nowrap; }
  .item.active { background: var(--selected); color: var(--text); }
  .item .label { overflow: hidden; text-overflow: ellipsis; }
  .item .count { margin-left: auto; font-family: InterTab, Inter, sans-serif; font-size: 13px; line-height: 18px; color: var(--text3); }

  /* Liste mit Kopfleiste, Pfad und Suche */
  .listcol { width: 440px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .win.medium .listcol, .win.narrow .listcol { width: auto; flex: 1; border-right: 0; }
  .header { height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--line); }
  .win.narrow .header { padding: 0 12px; }
  .header .quiet { color: var(--text3); font-size: 13px; margin-left: 6px; }

  /* Der Pfad: Teile, die man anklicken kann, sehen aus wie kleine Knöpfe */
  .path { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .crumb { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line-strong);
           background: var(--raised); color: var(--text2); font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; cursor: pointer; position: relative; }
  .crumb:hover, .crumb.hover { background: var(--hover); color: var(--text); border-color: var(--line-selected); }
  .crumb.here { background: var(--selected); color: var(--text); border-color: var(--line-selected); }
  .crumb.focus { outline: 2px solid rgba(255,255,255,.35); outline-offset: 1px; }
  .light .crumb.focus { outline-color: rgba(0,0,0,.5); }
  .crumb-last { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .tip { position: absolute; top: 34px; left: 0; background: var(--menu); border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow);
         padding: 4px 8px; display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 18px; color: var(--text); z-index: 20; white-space: nowrap; font-weight: 400; }
  .kbd { font-size: 11px; line-height: 14px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--text3); background: var(--raised); }

  .searchbar { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 24px; border-bottom: 1px solid var(--line); color: var(--text3); }
  .win.narrow .searchbar { padding: 0 12px; }
  .rows { flex: 1; overflow: hidden; }
  .row { height: 100px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); position: relative; }
  .win.narrow .row { padding: 0 12px; }
  .row.sel { background: var(--selected); }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: var(--text); background: var(--raised); border: 1px solid var(--line-strong); }
  .av.sm { width: 28px; height: 28px; font-size: 11px; }
  .cell { min-width: 0; flex: 1; }
  .l1 { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
  .l1 b { font-weight: 500; }
  .l1 .dom { color: var(--text3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  .l1 .t { margin-left: auto; color: var(--text3); font-size: 13px; font-family: InterTab, Inter, sans-serif; }
  .l2, .l3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l3 { color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; color: var(--text2); flex: none; font-size: 12px; line-height: 16px; font-weight: 500;
          height: 22px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--line-strong); }
  .unread-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--c0); flex: none; }

  /* Rechte Fläche: Übersicht oder Leser */
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ov { flex: 1; overflow: auto; padding: 24px 32px 48px; }
  .ov-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .ov-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .ov-head h1 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0; }
  .ov-head .meta { font-size: 13px; line-height: 18px; color: var(--text3); margin-top: 2px; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px; height: 36px; }
  .seg span { padding: 0 10px; display: grid; place-items: center; font-size: 12px; font-weight: 500; color: var(--text2); border-radius: 4px; border: 1px solid transparent; }
  .seg span.on { background: var(--selected); color: var(--text); border-color: var(--line-selected); }
  .btn { height: 36px; padding: 0 12px; border-radius: 4px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.secondary { background: var(--raised); border: 1px solid var(--line-strong); color: var(--text); }
  .btn.ghost { color: var(--text2); }
  .btn.sm { height: 28px; padding: 0 8px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tiles.two { grid-template-columns: repeat(2, 1fr); }
  .tile { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 4px; padding: 16px; min-width: 0; }
  .tile .lab { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text3); }
  .tile .val { font-family: InterTab, Inter, sans-serif; font-size: 28px; line-height: 32px; font-weight: 600; margin: 6px 0 4px; }
  .tile .note { font-size: 13px; line-height: 18px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { border-top: 1px solid var(--line); padding-top: 16px; }
  .card-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .card-h h2 { font-size: 14px; line-height: 22px; font-weight: 500; margin: 0; }
  .card-h .note { font-size: 13px; color: var(--text3); }
  .card-h .more { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text2); display: flex; align-items: center; gap: 4px; }

  /* Säulendiagramm */
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; border-bottom: 1px solid var(--line-strong); position: relative;
           background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 40px; }
  .col { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; }
  .col i { display: block; }
  .col i:last-child { border-radius: 2px 2px 0 0; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; color: var(--text3); margin-top: 4px; font-family: InterTab, Inter, sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* Zeilen in den Abschnitten */
  .lines { display: flex; flex-direction: column; }
  .ln { min-height: 48px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 6px 0; position: relative; }
  .ln:last-child { border-bottom: 0; }
  .ln .who { min-width: 0; flex: 1; }
  .ln .who b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .who small { font-size: 13px; line-height: 18px; color: var(--text3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .num { width: 92px; flex: none; text-align: right; font-size: 13px; line-height: 18px; }
  .ln .num b { font-family: InterTab, Inter, sans-serif; font-weight: 500; font-size: 14px; display: block; color: var(--text); }
  .ln .num small { color: var(--text3); }
  .ln .read { width: 132px; flex: none; font-size: 13px; line-height: 18px; color: var(--text2); }
  .ln .read small { display: flex; align-items: center; gap: 4px; color: var(--text3); }
  .bar { height: 4px; border-radius: 2px; background: var(--line-strong); margin: 5px 0 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--text3); }
  .ln .t { color: var(--text3); font-size: 13px; font-family: InterTab, Inter, sans-serif; flex: none; }
  .ln.hov { background: var(--hover); margin: 0 -8px; padding: 6px 8px; border-radius: 4px; }
  .acts { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; padding: 2px; background: var(--menu);
          border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow); }
  .acts .btn { height: 30px; color: var(--text); }

  .catrow { display: grid; grid-template-columns: 180px 1fr 56px 44px; align-items: center; gap: 12px; height: 32px; font-size: 14px; }
  .catrow .nm { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text2); }
  .catrow .n, .catrow .p { text-align: right; font-family: InterTab, Inter, sans-serif; font-size: 13px; }
  .catrow .p { color: var(--text3); }
  .catrow .bar { margin: 0; height: 6px; }

  .strip { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; margin: 4px 0 10px; }
  .strip i { display: block; height: 100%; }
  .qcard { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 4px; margin-top: 12px; }
  .qcard .tx { flex: 1; min-width: 0; }
  .qcard .tx b { font-weight: 500; display: block; }
  .qcard .tx small { font-size: 13px; line-height: 18px; color: var(--text2); }

  /* Leser (Mail offen) mit Aktionsleiste */
  .reader { flex: 1; display: flex; min-width: 0; }
  .mailtext { flex: 1; padding: 52px 64px; overflow: hidden; }
  .mailtext .inner { max-width: 600px; margin: 0 auto; }
  .mailtext h1 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 16px; }
  .mailtext p { font-size: 16px; line-height: 26px; color: var(--text); margin: 0 0 16px; }
  .mailhead { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
  .mailhead .av { width: 48px; height: 48px; }
  .actionrail { width: 60px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 4px; }
  .actionrail .ib { width: 40px; height: 40px; }
  .actionrail .ib.lead { background: var(--accent); color: #fff; }
  .actionrail .sep { height: 1px; align-self: stretch; background: var(--line); margin: 4px 0; }

  /* Paneel in Mittel/Schmal */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 8; }
  .panel { position: absolute; top: 0; right: 0; bottom: 0; width: 460px; background: var(--panel); border-left: 1px solid var(--line-strong); z-index: 9; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .win.narrow .panel { width: 100%; border-left: 0; }
  .panel-head { height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
  .panel .ov { padding: 16px; }

  /* Vergleichsbogen */
  .sheet { padding: 32px; color: #e8e9eb; font-family: Inter, sans-serif; background: #1f2023; min-height: 100%; }
  .sheet h1 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 6px; }
  .sheet p.lead { margin: 0 0 8px; color: #b4b8bf; max-width: 100ch; }
  .sheet h2 { font-size: 15px; font-weight: 600; margin: 32px 0 12px; color: #edeef0; }
  .sheet ol, .sheet ul { color: #c9ccd1; max-width: 110ch; padding-left: 20px; margin: 0; }
  .sheet li { margin-bottom: 6px; }
  .sheet li b { color: #edeef0; font-weight: 500; }
  .sheet code { font-size: 12px; background: #2b2d31; padding: 1px 5px; border-radius: 3px; }
  .cards { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .shot { display: flex; flex-direction: column; gap: 8px; }
  .shot .cap { font-size: 12px; line-height: 16px; color: #b4b8bf; max-width: 820px; }
  .shot .cap b { color: #edeef0; font-weight: 500; }
  .frame { border-radius: 6px; overflow: hidden; border: 1px solid #3a3c41; position: relative; }
  .frame > .scale { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .open-link { color: #8fb4ff; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = {

  "clock": '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  "chart-column": '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',

const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
const tinted = (n, c, cls = '') => `<span style="color:var(--c${c});display:flex">${icon(n, cls)}</span>`;

const GROUPS = [
  { label: 'Waiting for me', icon: 'user-check', c: 0, n: 18 },

// Säulen je Tag: [Waiting for me, Paper trail, Info, Junk]
function days(n) {
  const out = []; let s = 7;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let d = 0; d < n; d++) {
    const weekend = (d % 7 === 5 || d % 7 === 6);
    out.push([Math.round(1 + rnd() * (weekend ? 1 : 3)), Math.round(rnd() * 3), Math.round((weekend ? 5 : 7) + rnd() * 6), Math.round(rnd() * 2)]);
  }
  return out;
}
const CATS = [
  ['Newsletter', 'info', 2, 142], ['Personal', 'user-check', 0, 54], ['Promotion', 'info', 2, 47], ['Order shipping', 'text-quote', 1, 41],
  ['Service notice', 'info', 2, 38], ['Invoice', 'text-quote', 1, 22], ['Other', null, null, 68],
];

];

// ---------- Bausteine ----------
const item = (mark, label, count, active) =>
  `<div class="item ${active ? 'active' : ''}">${mark}<span class="label">${label}</span>${count ? `<span class="count">${count}</span>` : ''}</div>`;

function sidebar() {
  let h = `<div class="sidebar">`;
  h += `<div class="head"><span class="logo">T</span><span class="app">Mail</span>${icon('chevron-down', 'chev')}<span class="sp"></span><span class="ib">${icon('search')}</span><span class="ib boxed">${icon('square-pen')}</span></div>`;
  h += item(icon('inbox'), 'Unfiltered', 60, true);
  h += item(icon('reply'), 'Reply later', 3) + item(icon('clock'), 'Set aside', 2) + item(icon('flag'), 'Follow up', 1);
  h += `<div class="gtitle">Categories</div>`;
  for (const g of GROUPS) h += item(tinted(g.icon, g.c), g.label, g.n) ;
  h += `<div class="gtitle">Folders</div>`;
  h += item(icon('folder'), 'Archive') + item(icon('send'), 'Sent') + item(icon('folder'), 'Projekte');
  return h + `</div>`;
}
function rail() {
  let h = `<div class="rail"><div class="head"><span class="logo">T</span></div>`;
  h += item(icon('inbox'), '', 0, true) + item(icon('reply'), '') + item(icon('clock'), '') + item(icon('flag'), '');
  h += `<div class="sep"></div>`;
  for (const g of GROUPS) h += item(tinted(g.icon, g.c), '');
  return h + `</div>`;
}

// Der Pfad über der Liste. here = die Übersicht ist zu sehen; hover/focus nur für den Bogen.
function path({ here, hover, focus, tip, narrowBack }) {
  const ov = `<span class="crumb ${here ? 'here' : ''} ${hover ? 'hover' : ''} ${focus ? 'focus' : ''}">${icon('chart-column', 'sm')}Overview${
    tip ? `<span class="tip">Show overview <span class="kbd">Esc</span></span>` : ''}</span>`;
  const view = `<span class="crumb-last">${icon('inbox')}Unfiltered<span class="quiet tab">60</span></span>`;
  return `<div class="path">${narrowBack ? '' : ov}${icon('chevron-right', 'chev')}${view}</div>`;
}
function header(opts) {
  return `<div class="header">${path(opts)}<span class="sp"></span>
    <span class="ib">${icon('arrow-up-down')}</span><span class="ib">${icon('refresh-cw')}</span></div>`;
}
function list(opts, sel) {
  let h = `<div class="listcol">${header(opts)}<div class="searchbar">${icon('search')}<span>Search mail</span></div><div class="rows">`;
  MAILS.forEach((m, i) => {
    const [av, from, dom, t, subj, cat, ic, c, pv, unread] = m;
    h += `<div class="row ${sel === i ? 'sel' : ''}">${unread ? '' : ''}<div class="av">${av}</div><div class="cell">
      <div class="l1">${unread ? '<span class="unread-dot" style="align-self:center"></span>' : ''}<b>${from}</b><span class="dom">${dom}</span><span class="t">${t}</span></div>
      <div class="l2">${subj}</div>
      <div class="l3"><span class="pill"><span style="color:var(--c${c});display:flex">${icon(ic, 'sm')}</span>${cat}</span><span style="overflow:hidden;text-overflow:ellipsis">${pv}</span></div></div></div>`;
  });
  return h + `</div></div>`;
}

function chart(range) {
  const d = days(range);
  const max = Math.max(...d.map(x => x.reduce((a, b) => a + b, 0)));
  const scale = 112 / max;
  let h = `<div class="chart">`;
  for (const col of d) {
    h += `<div class="col">${col.map((v, i) => v ? `<i style="height:${Math.max(2, v * scale - 2)}px;background:var(--s${i})"></i>` : '').join('')}</div>`;
  }
  h += `</div>`;
  const ax = range === 7 ? ['Thu', 'Today'] : range === 30 ? ['30 Sep', '15 Oct', 'Today'] : ['1 Aug', '1 Sep', '1 Oct', 'Today'];
  h += `<div class="axis">${ax.map(a => `<span>${a}</span>`).join('')}</div>`;
  h += `<div class="legend">${GROUPS.map((g, i) => `<span><i class="sw" style="background:var(--s${i})"></i>${g.label}</span>`).join('')}</div>`;
  return h;
}

function overview({ range = 30, compact = false, hoverSender = -1 } = {}) {
  const total = CATS.reduce((a, c) => a + c[3], 0);
  const perDay = Math.round(total / 30);
  let h = `<div class="ov"><div class="ov-inner">`;
  // Kopf
  h += `<div class="ov-head"><div><h1>Overview</h1><div class="meta">All accounts · ${RANGES[range]} · As of Today 09:14</div></div><span class="sp"></span>
    <div class="seg">${[7, 30, 90].map(r => `<span class="${r === range ? 'on' : ''}">${r} days</span>`).join('')}</div>
    <span class="btn ghost">${icon('mail')}All accounts${icon('chevron-down', 'chev')}</span></div>`;
  // Kennzahlen
  h += `<div class="tiles ${compact ? 'two' : ''}">
    <div class="tile"><div class="lab">In your inbox</div><div class="val">60</div><div class="note">31 older than a week</div></div>
    <div class="tile"><div class="lab">Came in</div><div class="val">${total}</div><div class="note">about ${perDay} a day</div></div>

    <div class="tile"><div class="lab">Newsletters and ads</div><div class="val">46%</div><div class="note">189 of ${total} mails</div></div>
  </div>`;
  // Neueste von Menschen
  h += `<div class="card"><div class="card-h"><h2>Latest from people</h2><span class="note">2 unread</span><span class="more">Show all 18${icon('chevron-right', 'chev')}</span></div><div class="lines">`;
  for (const [av, name, subj, t, unread] of PEOPLE) {
    h += `<div class="ln"><div class="av sm">${av}</div><div class="who"><b>${unread ? '<span class="unread-dot" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>' : ''}${name}</b><small>${subj}</small></div><span class="t">${t}</span></div>`;
  }
  h += `</div></div>`;
  // Woher die Mail kommt
  h += `<div class="card"><div class="card-h"><h2>What comes in</h2><span class="note">per day, by category group</span><span class="more">${icon('chart-column', 'sm')}Table</span></div>${chart(range)}`;
  h += `<div style="margin-top:20px">`;
  for (const [nm, ic, c, n] of CATS) {
    const p = Math.round(n / total * 100);
    h += `<div class="catrow"><span class="nm">${ic ? tinted(ic, c, 'sm') : `<span style="width:14px"></span>`}${nm}</span><div class="bar"><i style="width:${n / CATS[0][3] * 100}%"></i></div><span class="n">${n}</span><span class="p">${p}%</span></div>`;
  }
  h += `</div></div>`;
  // Lauteste Absender
  h += `<div class="card"><div class="card-h"><h2>Who sends the most</h2><span class="note">and how much of it you open</span></div><div class="lines">`;
  SENDERS.forEach(([av, name, addr, cat, n, opened], i) => {
    const rare = opened / n < 0.15;
    const week = Math.round(n / (range / 7) * 10) / 10;
    h += `<div class="ln ${i === hoverSender ? 'hov' : ''}"><div class="av sm">${av}</div>
      <div class="who"><b>${name}</b><small>${compact ? cat : `${addr} · ${cat}`}</small></div>
      ${compact ? '' : `<div class="read">Opened ${opened} of ${n}<div class="bar"><i style="width:${opened / n * 100}%"></i></div>${rare ? `<small>${icon('eye-off', 'sm')}Rarely opened</small>` : '<small>&nbsp;</small>'}</div>`}
      <div class="num"><b>${n}</b><small>${week} a week</small></div>
      ${i === hoverSender ? `<div class="acts"><span class="btn ghost">${icon('search', 'sm')}Show mails</span><span class="btn ghost">${icon('bell-off', 'sm')}Mute</span><span class="btn ghost">${icon('mail-x', 'sm')}Unsubscribe</span></div>` : ''}
    </div>`;
  });
  h += `</div></div>`;
  // Was im Posteingang liegt
  const g = GROUPS, sum = g.reduce((a, x) => a + x.n, 0);
  h += `<div class="card"><div class="card-h"><h2>What is in your inbox</h2><span class="note">60 mails</span></div>
    <div class="strip">${g.map((x, i) => `<i style="width:${x.n / sum * 100}%;background:var(--s${i})"></i>`).join('')}</div>
    <div class="legend" style="margin-top:0">${g.map((x, i) => `<span><i class="sw" style="background:var(--s${i})"></i>${x.label} <span class="tab" style="color:var(--text3)">${x.n}</span></span>`).join('')}</div>
    <div class="legend"><span style="color:var(--text3)">By age</span><span>Today <b class="tab" style="font-weight:500">8</b></span><span>This week <b class="tab" style="font-weight:500">21</b></span><span>Older <b class="tab" style="font-weight:500">31</b></span></div>
    <div class="qcard">${icon('archive')}<div class="tx"><b>23 newsletters and ads are older than a week</b><small>Most of them you never opened.</small></div><span class="btn secondary">Show them</span></div>
  </div>`;
  return h + `</div></div>`;
}

function reader() {

}

// ---------- Fenster ----------
function win(mode, theme, range, extra = {}) {
  const cls = `win ${theme} ${mode === 'medium' ? 'medium' : mode === 'narrow' ? 'narrow' : ''}`;
  if (mode === 'wide') {
    return `<div class="${cls}">${sidebar()}<div class="content">${list({ here: true, focus: extra.focus })}<div class="right">${overview({ range, hoverSender: extra.hoverSender ?? -1 })}</div></div></div>`;
  }
  if (mode === 'open') {
    return `<div class="${cls}">${sidebar()}<div class="content">${list({ here: false, hover: true, tip: true }, 0)}<div class="right">${reader()}</div></div></div>`;
  }
  if (mode === 'medium') {
    return `<div class="${cls}">${rail()}<div class="content">${list({ here: true })}</div>
      <div class="scrim"></div><div class="panel"><div class="panel-head"><span class="crumb-last">${icon('chart-column')}Overview</span><span class="sp"></span><span class="ib">${icon('x')}</span></div>${overview({ range, compact: true })}</div></div>`;
  }
  // narrow: Übersicht ersetzt die Liste, zurück über den Pfad
  return `<div class="${cls}"><div class="content"><div class="listcol"><div class="header"><span class="ib">${icon('panel-left')}</span>
    <span class="crumb">${icon('chevron-left', 'sm')}Unfiltered</span>${icon('chevron-right', 'chev')}<span class="crumb-last">${icon('chart-column')}Overview</span></div>
    ${overview({ range, compact: true })}</div></div></div>`;
}

function shot(mode, theme, w, h, s, cap, extra = {}) {
  const href = `?mode=${mode}&theme=${theme}`;
  return `<div class="shot"><div class="frame" style="width:${w * s}px;height:${h * s}px"><div class="scale" style="width:${w}px;height:${h}px;transform:scale(${s})">${win(mode, theme, 30, extra)}</div></div>
    <div class="cap">${cap} · <a class="open-link" href="${href}">einzeln öffnen</a></div></div>`;
}

const mode = q.get('mode');
const range = Number(q.get('range') || 30);
if (mode) {
  document.getElementById('root').innerHTML = `<div style="width:100vw;height:100vh">${win(mode, q.get('theme') || 'dark', range)}</div>`;
} else {
  document.getElementById('root').innerHTML = `<div class="sheet">

    <h2>2 · Mail offen: der Pfad führt zurück</h2>
    <div class="cards">${shot('open', 'dark', 1600, 1000, 0.62, '<b>Mail offen.</b> „Overview“ ist ein Knopf (hier mit Hover und Tooltip „Show overview · Esc“). Ein Klick schließt die Mail, rechts steht wieder die Übersicht; die Auswahl in der Liste geht weg, Scrollstand und Ansicht bleiben.')}</div>

    <h2>3 · Absender: Entscheidung direkt an der Zeile</h2>
    <div class="cards">${shot('wide', 'dark', 1600, 1000, 0.62, '<b>Zeile unter dem Zeiger.</b> „Show mails“ (Suche nach dem Absender), „Mute“ (gibt es schon) und „Unsubscribe“ (nur, wenn die Mail eine List-Unsubscribe-Kopfzeile hat; eigener Schritt, siehe unten).', { hoverSender: 1 })}</div>

    <h2>4 · Kleiner: Mittel und Schmal</h2>
    <div class="cards">${shot('medium', 'dark', 900, 760, 0.62, '<b>Mittel.</b> Keine rechte Fläche: „Overview“ im Pfad öffnet die Übersicht als Paneel, wie eine Mail. Kacheln zwei je Reihe, Absender ohne Lese-Spalte.')}
    ${shot('narrow', 'dark', 480, 900, 0.62, '<b>Schmal.</b> Die Übersicht ersetzt die Liste, „‹ Unfiltered“ führt zurück.')}</div>

      <li><b>Abgrenzung zu Insights der Zentrale:</b> Die zählen Einträge je Quelle (Popups, Erledigt). Diese Übersicht zählt Mails je Kategorie und Absender.</li>
    </ul>
  </div>`;
}
