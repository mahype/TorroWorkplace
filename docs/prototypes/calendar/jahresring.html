<meta charset="utf-8">
<title>Jahresring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Zifferblatt als Bühne links, Steuerung + Ringlegende + Liste rechts; stapelt unter 900px */
:root{
  --bg:#0C0F14; --surface:#131821; --surface-2:#1A2130; --line:#252F40; --fg:#E8ECF4; --muted:#8D97A9; --faint:#4B5567;
  --work:#78AEFF; --private:#52D6C8; --deadline:#FF7D8C; --allday:#A6DB7B; --birthday:#F4BA66; --holiday:#BBA1FF;
  --track:#141A24; --shade:#0E131B; --night:#1A2232; --daylight:#3A3A2E; --weekend:#2A3346;
  --s-winter:#3C5677; --s-spring:#4B6B3B; --s-summer:#7A6233; --s-autumn:#7A4545;
  --on-color:#0C0F14; --now:#FFFFFF; --hover:rgba(255,255,255,.055);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6; --line:#D8DEE9; --fg:#121822; --muted:#5A6577; --faint:#A3ACBB;
    --work:#2D6BDD; --private:#0E9A8C; --deadline:#DD4157; --allday:#4F9426; --birthday:#C98213; --holiday:#7652E0;
    --track:#E8ECF3; --shade:#DEE3EC; --night:#CDD5E3; --daylight:#F6EBC4; --weekend:#D3D9E5;
    --s-winter:#B9CBE6; --s-spring:#C4DDB0; --s-summer:#F0D79E; --s-autumn:#EBBDB0;
    --on-color:#FFFFFF; --now:#121822; --hover:rgba(18,24,34,.06);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6; --line:#D8DEE9; --fg:#121822; --muted:#5A6577; --faint:#A3ACBB;
  --work:#2D6BDD; --private:#0E9A8C; --deadline:#DD4157; --allday:#4F9426; --birthday:#C98213; --holiday:#7652E0;
  --track:#E8ECF3; --shade:#DEE3EC; --night:#CDD5E3; --daylight:#F6EBC4; --weekend:#D3D9E5;
  --s-winter:#B9CBE6; --s-spring:#C4DDB0; --s-summer:#F0D79E; --s-autumn:#EBBDB0;
  --on-color:#FFFFFF; --now:#121822; --hover:rgba(18,24,34,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding:0 16px;}
.app{max-width:1240px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font:700 28px/1 var(--font-display);letter-spacing:-.02em;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font:600 13px var(--font-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--work);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:600 16px var(--font-body)}
.text-btn{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:600 13px var(--font-body)}
.stage{position:relative;width:100%;max-width:780px;margin:0 auto;aspect-ratio:1;container-type:inline-size}
#dial{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
#dial.zoomable{cursor:zoom-in}
#dial.dragging{cursor:grabbing}
#dial path{fill-rule:evenodd}
.hub{position:absolute;left:50%;top:50%;width:29.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6cqw;padding:2.2cqw;pointer-events:none;
  background:radial-gradient(circle at 50% 35%,var(--surface-2),var(--surface) 70%);box-shadow:0 0 0 1px var(--line)}
.crumbs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.4cqw;font:500 max(9px,1.45cqw) var(--font-mono);color:var(--faint)}
.crumbs button{all:unset;pointer-events:auto;cursor:pointer;color:var(--muted);padding:0 .3cqw;border-radius:4px}
.crumbs button:hover{color:var(--fg)}
.crumbs button[aria-current="true"]{color:var(--fg)}
.hub-title{font:700 max(15px,4.1cqw)/1.05 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.hub-sub{font:500 max(10px,1.75cqw) var(--font-body);color:var(--muted)}
.hub-stat{font:500 max(9px,1.5cqw) var(--font-mono);color:var(--muted)}
.hub-kind{font:600 max(9px,1.4cqw) var(--font-body);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:.6cqw}
.hub-item{font:700 max(13px,2.9cqw)/1.15 var(--font-display);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5cqw;max-width:100%}
.chip{font:600 max(9px,1.35cqw) var(--font-body);padding:.25cqw .9cqw;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:.5cqw;white-space:nowrap}
.dot{width:.55em;height:.55em;border-radius:50%;display:inline-block;flex:none}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin:0}
.hint kbd{font:500 11px var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font:500 11px var(--font-mono);text-transform:none;letter-spacing:0;color:var(--faint)}
.rings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rings label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-radius:8px;cursor:pointer}
.rings label:hover{background:var(--hover)}
.bar{height:6px;border-radius:3px;display:block}
.rname{font-weight:600;font-size:14px;line-height:1.2}
.rsub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch span{display:block;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked+span{background:var(--work)}
.switch input:checked+span::after{transform:translateX(12px);background:var(--on-color)}
.switch input:disabled+span{opacity:.45}
.groupby{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:10px 92px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.list li:first-child{border-top:0}
.list .when{font:500 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list .what{overflow-wrap:anywhere}
.list .past{opacity:.45}
.empty{color:var(--muted);font-size:13px;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* SVG */
.track{fill:var(--track)}
.shade{fill:var(--shade)}
.ctx-day{fill:var(--daylight)} .ctx-night{fill:var(--night)} .ctx-we{fill:var(--weekend)} .ctx-hol{fill:var(--holiday);opacity:.55}
.s0{fill:var(--s-winter)} .s1{fill:var(--s-spring)} .s2{fill:var(--s-summer)} .s3{fill:var(--s-autumn)}
.ev{stroke:var(--bg);stroke-width:1}
.ev.work{fill:var(--work)} .ev.priv{fill:var(--private)}
.heat{fill:var(--work)}
.ev:hover,.allday:hover,.holiday:hover,.heat:hover{filter:brightness(1.18)}
.dl line{stroke:var(--deadline);stroke-width:1.6} .dl path{fill:var(--deadline)} .hit{fill:transparent}
.allday{fill:var(--allday)}
.holiday{fill:var(--holiday)} .bday{fill:var(--birthday);stroke:var(--bg);stroke-width:1.2}
.lbl{fill:var(--on-color);font:600 11.5px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl-sm{fill:var(--on-color);font:600 10px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.scale-base{fill:none;stroke:var(--line)}
.tk-major{stroke:var(--muted);stroke-width:1.3} .tk-mid{stroke:var(--faint)} .tk-minor{stroke:var(--faint);opacity:.7}
.sc-lbl{fill:var(--fg);font:600 16px var(--font-display);text-anchor:middle;dominant-baseline:central}
.sc-day{fill:var(--muted);font:500 12px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.sc-day.we{fill:var(--faint)} .sc-day.mo{fill:var(--fg)}
.sc-month{fill:var(--fg);font:700 11px var(--font-body);letter-spacing:.1em;text-anchor:middle;dominant-baseline:central}
.sc-hr{fill:var(--muted);font:500 12px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.sc-hr.major{fill:var(--fg)}
.guide{stroke:var(--line);stroke-dasharray:2 5}
.turn-lbl rect{fill:var(--bg);opacity:.88}
.turn-lbl text{fill:var(--fg);font-family:var(--font-mono);font-weight:500;text-anchor:middle;dominant-baseline:central}
.hl{fill:var(--hover);pointer-events:none}
.now-line{stroke:var(--now);stroke-width:2;stroke-linecap:round}
.now-dot{fill:var(--now)}
.now-pulse{fill:none;stroke:var(--now);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.8}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion: reduce){.now-pulse{animation:none;opacity:.4}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>Jahresring</h1>
      <p>Prototyp · runder Kalender, der von Jahr bis Stunde zoomt</p>
    </div>
    <div class="seg" role="group" aria-label="Darstellung">
      <button id="m-rings" aria-pressed="true">Ringe</button>
      <button id="m-spiral" aria-pressed="false">Spirale</button>
    </div>
  </header>

  <div class="layout">
    <section class="stage-col">
      <div class="toolbar">
        <button class="icon-btn" id="prev" aria-label="Zurück">‹</button>
        <div class="seg" role="group" aria-label="Zoomstufe" id="levels">
          <button data-level="0">Jahr</button>
          <button data-level="1">Monat</button>
          <button data-level="2">Woche</button>
          <button data-level="3">Tag</button>
        </div>
        <button class="icon-btn" id="next" aria-label="Weiter">›</button>
        <button class="text-btn" id="today">Heute</button>
      </div>
      <div class="stage">
        <svg id="dial" viewBox="-480 -480 960 960" role="img" aria-label="Runder Kalender">
          <g id="hl"></g><g id="main"></g><g id="now"></g>
        </svg>
        <div class="hub" id="hub"></div>
      </div>
      <p class="hint"><kbd>Scrollen</kbd> zoomt · <kbd>Ziehen</kbd> dreht durch die Zeit · <kbd>Klick</kbd> zoomt hinein · <kbd>←</kbd><kbd>→</kbd> blättern · <kbd>+</kbd><kbd>−</kbd> zoomen</p>
    </section>

    <aside>
      <div class="panel">
        <h2>Ringe <small>von innen nach außen</small></h2>
        <ul class="rings" id="rings"></ul>
        <div class="groupby">
          <span>Ringe gruppieren nach</span>
          <div class="seg" role="group" aria-label="Ringe gruppieren nach">
            <button aria-pressed="true">Typ</button>
            <button disabled title="Kommt, sobald mehrere Kalender verbunden sind">Kalender</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2 id="list-title">Im Blick</h2>
        <ul class="list" id="list"></ul>
      </div>
      <p class="note">Alle Termine sind Beispieldaten für 2026.</p>
    </aside>
  </div>
</div>

<script>
(() => {
const TAU = Math.PI * 2, DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => n.toFixed(1);
const pol = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];

const MLONG = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MSHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDLONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

const YEAR = 2026;
let NOW = Date.now();
if (new Date(NOW).getFullYear() !== YEAR) NOW = new Date(YEAR, 9, 8, 10, 40).getTime();

/* ---------- Datum ---------- */
const D = (m, d, h = 0, mi = 0) => new Date(YEAR, m - 1, d, h, mi).getTime();
const dayStart = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const addDays = (t, n) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes()).getTime(); };
function unitRange(level, t) {
  const d = new Date(t), y = d.getFullYear(), m = d.getMonth(), dd = d.getDate();
  if (level === 0) return [new Date(y, 0, 1).getTime(), new Date(y + 1, 0, 1).getTime()];
  if (level === 1) return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()];
  if (level === 2) { const off = (d.getDay() + 6) % 7; return [new Date(y, m, dd - off).getTime(), new Date(y, m, dd - off + 7).getTime()]; }
  return [new Date(y, m, dd).getTime(), new Date(y, m, dd + 1).getTime()];
}
function days(s, e) {
  const out = []; let d = new Date(dayStart(s));
  while (d.getTime() < e) { const n = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); out.push([d.getTime(), n.getTime()]); d = n; }
  return out;
}
function isoWeek(t) {
  const d = new Date(t); const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const wd = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - wd);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - y0) / DAY + 1) / 7);
}
const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dShort = t => { const d = new Date(t); return `${WD[d.getDay()]} ${d.getDate()}. ${MSHORT[d.getMonth()]}`; };
const hrs = h => h.toLocaleString('de-DE', { maximumFractionDigits: 1 });
function sun(ds) {
  const d = new Date(ds); const doy = (ds - new Date(d.getFullYear(), 0, 1)) / DAY;
  const len = 12 + 4.3 * Math.sin(TAU * (doy - 80) / 365.25);
  const dst = ds >= D(3, 29) && ds < D(10, 25);
  const noon = 12.33 + (dst ? 1 : 0);
  return { rise: noon - len / 2, set: noon + len / 2 };
}

/* ---------- Beispieldaten ---------- */
let seed = 11;
const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
const pick = a => a[Math.floor(rnd() * a.length)];
const ALL = [], EVENTS = [], DEADLINES = [], ALLDAY = [], BIRTHDAYS = [], HOLIDAYS = [];
const add = (arr, o) => { o.id = ALL.length; ALL.push(o); arr.push(o); return o; };

[[1,1,'Neujahr'],[4,3,'Karfreitag'],[4,6,'Ostermontag'],[5,1,'Tag der Arbeit'],[5,14,'Christi Himmelfahrt'],[5,25,'Pfingstmontag'],
 [6,4,'Fronleichnam'],[10,3,'Tag der Deutschen Einheit'],[11,1,'Allerheiligen'],[12,25,'1. Weihnachtstag'],[12,26,'2. Weihnachtstag']]
  .forEach(([m, d, t]) => add(HOLIDAYS, { kind: 'holiday', title: t, start: D(m, d), end: D(m, d + 1) }));

[[1,17,'Jana'],[2,14,'Sophie'],[3,3,'Mama'],[4,19,'Lena'],[5,24,'Lea'],[6,29,'Max'],[8,5,'Tom'],[9,9,'Ben'],
 [10,8,'Kai'],[10,10,'Anna'],[10,22,'Papa'],[11,28,'Paul'],[12,12,'Oma Hilde']]
  .forEach(([m, d, n]) => add(BIRTHDAYS, { kind: 'birthday', title: n, start: D(m, d), end: D(m, d + 1) }));

const VAC = [], TRIP = [];
[['Skiurlaub Zillertal',2,14,2,22,'vac'],['Messe Köln',3,10,3,13,'trip'],['Ostern bei den Eltern',4,3,4,7,'vac'],
 ['Brückentag',5,15,5,16,'vac'],['Sommerurlaub Mallorca',8,3,8,17,'vac'],['Fokuswoche Konzept',10,5,10,10,'focus'],
 ['Konferenz Berlin',10,21,10,24,'trip'],['Dienstreise Hamburg',11,11,11,13,'trip'],['Weihnachtsurlaub',12,23,13,1,'vac']]
  .forEach(([t, m0, d0, m1, d1, type]) => {
    const o = add(ALLDAY, { kind: 'allday', title: t, start: D(m0, d0), end: D(m1, d1) });
    if (type === 'vac') VAC.push(o); if (type === 'trip') TRIP.push(o);
  });

[['Angebot Stadtwerke',1,20,12],['Q1-Bericht',4,10,17],['Förderantrag',6,15,18],['Steuererklärung',7,31,23],
 ['Rechnungen Q3',10,5,10],['Konzept-Entwurf abgeben',10,8,17],['Release 0.3',10,9,12],['Release 0.4',11,27,12],['Jahresplanung',12,14,17]]
  .forEach(([t, m, d, h]) => add(DEADLINES, { kind: 'deadline', title: t, start: D(m, d, h), end: D(m, d, h) }));
for (let m = 1; m <= 11; m++) add(DEADLINES, { kind: 'deadline', title: 'Monatsabschluss', start: D(m, 28, 16), end: D(m, 28, 16) });

const WORK = ['Sprint Planning','1:1 mit Lena','Design Review','Kundencall Müller GmbH','Architektur-Runde','Roadmap-Sync',
  'Interview Backend','Retro','Support-Übergabe','Produkt-Demo','Budget-Abstimmung','Pairing mit Max','Onboarding Jonas'];
const SLOTS = [10, 10.5, 11, 11.5, 13.5, 14, 14.5, 15, 16], DURS = [30, 45, 60, 60, 90];
const EVENING = [['Kino',20,2.5],['Abendessen mit Freunden',19,2.5],['Yoga',18.5,1],['Elternabend',19.5,1.5],['Laufen',18,1]];
const WEEKEND = [['Brunch',11,2],['Wandern',10,5],['Familienbesuch',14,4],['Flohmarkt',9,3],['Grillen',17,4]];
const inAny = (list, t) => list.find(o => t >= o.start && t < o.end);
const ev = (cal, title, s, durMin) => add(EVENTS, { kind: 'event', cal, title, start: s, end: s + durMin * MIN });

for (let d = new Date(YEAR, 0, 1); d.getFullYear() === YEAR; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
  const ds = d.getTime(), wd = d.getDay(), weekday = wd >= 1 && wd <= 5;
  const hol = HOLIDAYS.some(h => h.start === ds), vac = inAny(VAC, ds + HOUR * 12), trip = inAny(TRIP, ds + HOUR * 12);
  if (ds === D(10, 8)) {
    ev('Arbeit', 'Daily Standup', D(10, 8, 9, 30), 15);
    ev('Arbeit', 'Workshop Kalender-Konzept', D(10, 8, 10), 90);
    ev('Privat', 'Mittagessen mit Jana', D(10, 8, 12, 30), 60);
    ev('Arbeit', 'Kundencall Stadtwerke', D(10, 8, 14), 60);
    ev('Arbeit', '1:1 mit Max', D(10, 8, 14, 30), 45);

  }
  const u = g.U(NOW), [x0, y0] = g.pt(u, 0), [x1, y1] = g.pt(u, 1), [x, y] = g.pt(u, .3);
  return `<line class="now-line" x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}"/><circle class="now-pulse" cx="${f1(x)}" cy="${f1(y)}" r="6"/><circle class="now-dot" cx="${f1(x)}" cy="${f1(y)}" r="4.5"/>`;
}

/* ---------- DOM ---------- */
const svg = document.getElementById('dial'), mainL = document.getElementById('main'), hlL = document.getElementById('hl'), nowL = document.getElementById('now');
const hub = document.getElementById('hub');
let lastHub = '';

function render() {
  const g = S.mode === 'rings' ? ringsGeom() : spiralGeom(); S.g = g;
  mainL.innerHTML = drawContent(g) + (g.mode === 'rings' ? ringScale(g) : spiralDecor(g));
  nowL.innerHTML = drawNow(g);
  drawHL(); updateHub();
}
function drawHL() {
  if (S.hoverT == null || S.level >= 3 || S.drag?.moved) { hlL.innerHTML = ''; svg.classList.remove('zoomable'); return; }
  const [a, b] = unitRange(S.level + 1, S.hoverT);
  hlL.innerHTML = `<path class="hl" d="${S.g.wedge(a, b)}"/>`; svg.classList.add('zoomable');
}

const KIND = {
  event: ['Termin', 'var(--work)'], deadline: ['Frist', 'var(--deadline)'], allday: ['Ganztägig', 'var(--allday)'],
  birthday: ['Geburtstag', 'var(--birthday)'], holiday: ['Feiertag', 'var(--holiday)'],
};
const dotOf = it => it.kind === 'event' && it.cal === 'Privat' ? 'var(--private)' : KIND[it.kind][1];
function itemMeta(it) {
  if (it.kind === 'event') return `${dShort(it.start)} · ${hm(it.start)}–${hm(it.end)}`;
  if (it.kind === 'deadline') return `${dShort(it.start)} · bis ${hm(it.start)}`;
  if (it.kind === 'allday') { const last = addDays(it.end, -1), n = Math.round((it.end - it.start) / DAY); return `${dShort(it.start)} – ${dShort(last)} · ${n} ${n === 1 ? 'Tag' : 'Tage'}`; }
  return dShort(it.start);
}
function unitLabel(lv, t) {
  const d = new Date(t);
  return [String(d.getFullYear()), MLONG[d.getMonth()], 'KW ' + isoWeek(t), `${WD[d.getDay()]} ${d.getDate()}.`][lv];
}
function itemsIn(a, b, kinds) {
  return ALL.filter(it => kinds.includes(it.kind) && it.end > a && it.start < b || (it.kind === 'deadline' && kinds.includes('deadline') && it.start >= a && it.start < b))
    .filter((it, i, arr) => arr.indexOf(it) === i).sort((x, y) => x.start - y.start);
}
function updateHub() {
  const lv = S.level, t = S.anchor, d = new Date(t);
  const crumbs = [];
  for (let i = 0; i <= lv; i++) crumbs.push(`<button data-lv="${i}"${i === lv ? ' aria-current="true"' : ''}>${unitLabel(i, t)}</button>`);
  let body;
  const h = S.hover;
  if (h && h.item) {
    const [k] = KIND[h.item.kind];
    body = `<div class="hub-kind" style="color:${dotOf(h.item)}"><span class="dot" style="background:${dotOf(h.item)}"></span>${k}${h.item.cal ? ' · ' + h.item.cal : ''}</div>
      <div class="hub-item">${esc(h.item.title)}</div><div class="hub-sub">${itemMeta(h.item)}</div>`;
  } else if (h && h.day != null) {
    const st = STAT.get(h.day) || { count: 0, hours: 0 };
    body = `<div class="hub-kind" style="color:var(--work)"><span class="dot" style="background:var(--work)"></span>Auslastung</div>
      <div class="hub-item">${dShort(h.day)}</div><div class="hub-sub">${st.count} Termine · ${hrs(st.hours)} h belegt</div>`;
  } else if (h && h.ctx) {
    body = `<div class="hub-kind" style="color:var(--muted)">Kontext</div><div class="hub-sub">${esc(h.ctx)}</div>`;
  } else {
    const [a, b] = unitRange(lv, t);
    const evs = EVENTS.filter(e => e.start >= a && e.start < b), hours = evs.reduce((x, e) => x + (e.end - e.start) / HOUR, 0);
    const title = [d.getFullYear(), MLONG[d.getMonth()], 'KW ' + isoWeek(t), WDLONG[d.getDay()]][lv];
    const last = new Date(b - DAY);
    const sub = ['', String(d.getFullYear()), `${new Date(a).getDate()}. ${MSHORT[new Date(a).getMonth()]} – ${last.getDate()}. ${MSHORT[last.getMonth()]}`, `${d.getDate()}. ${MLONG[d.getMonth()]}`][lv];
    let extra = '';
    if (lv === 3) {
      const marks = itemsIn(a, b, ['allday', 'birthday', 'holiday', 'deadline']);
      if (marks.length) extra = `<div class="chips">${marks.map(m => `<span class="chip"><span class="dot" style="background:${dotOf(m)}"></span>${m.kind === 'birthday' ? 'Geburtstag ' : ''}${esc(m.title)}${m.kind === 'deadline' ? ' · ' + hm(m.start) : ''}</span>`).join('')}</div>`;
      const nxt = NOW >= a && NOW < b ? evs.find(e => e.start > NOW) : null;
      if (nxt) extra += `<div class="hub-stat">als Nächstes ${hm(nxt.start)} · ${esc(nxt.title)}</div>`;
    }
    body = `<div class="hub-title">${title}</div>${sub ? `<div class="hub-sub">${sub}</div>` : ''}<div class="hub-stat">${evs.length} Termine · ${hrs(hours)} h</div>${extra}`;
  }
  const html = `<nav class="crumbs" aria-label="Zoompfad">${crumbs.join('<span>›</span>')}</nav>${body}`;
  if (html !== lastHub) { hub.innerHTML = html; lastHub = html; }
}
hub.addEventListener('click', e => { const b = e.target.closest('button[data-lv]'); if (b) setLevel(+b.dataset.lv); });

function updateList() {
  const [a, b] = unitRange(S.level, S.anchor);
  const kinds = S.level >= 2 ? ['event', 'deadline', 'allday', 'birthday', 'holiday'] : ['deadline', 'allday', 'birthday', 'holiday'];
  let items = itemsIn(a, b, kinds);
  if (NOW >= a && NOW < b) { const i = items.findIndex(it => it.end >= NOW); if (i > 2) items = items.slice(i - 2); }
  items = items.slice(0, 10);
  document.getElementById('list-title').innerHTML = `Im Blick <small>${unitLabel(S.level, S.anchor)}${S.level === 3 ? '' : S.level === 1 ? ' ' + new Date(S.anchor).getFullYear() : ''}</small>`;
  document.getElementById('list').innerHTML = items.length ? items.map(it => {
    const when = it.kind === 'event' || it.kind === 'deadline' ? (S.level === 3 ? hm(it.start) : `${new Date(it.start).getDate()}.${new Date(it.start).getMonth() + 1}. ${hm(it.start)}`) : `${new Date(it.start).getDate()}.${new Date(it.start).getMonth() + 1}.`;
    return `<li class="${it.end < NOW && it.kind !== 'deadline' || (it.kind === 'deadline' && it.start < NOW) ? 'past' : ''}"><span class="dot" style="background:${dotOf(it)}"></span><span class="when">${when}</span><span class="what">${esc(it.title)}</span></li>`;
  }).join('') : '<li><span></span><span></span><span class="empty">Nichts geplant.</span></li>';
}

function buildRings() {
  document.getElementById('rings').innerHTML = RINGS.map(r => `<li><label for="ring-${r.id}">
    <span class="bar" style="background:${r.color}"></span>
    <span class="rname">${r.name}<span class="rsub">${r.sub}</span></span>
    <span class="switch"><input type="checkbox" id="ring-${r.id}" data-ring="${r.id}" checked${r.fixed ? ' disabled' : ''}><span></span></span></label></li>`).join('');
  document.getElementById('rings').addEventListener('change', e => {
    const id = e.target.dataset.ring; if (!id) return;
    e.target.checked ? S.hidden.delete(id) : S.hidden.add(id); render();
  });
}

/* ---------- Animation & Navigation ---------- */
function animateTo(to) {
  cancelAnimationFrame(S.raf);
  const from = { ...S.v }, key = S.mode === 'rings' ? 'dur' : 'P', d0 = from[key], d1 = to[key];
  const fix = Math.abs(d0 - d1) > 1 ? (to.start * d0 - from.start * d1) / (d0 - d1) : null;
  const t0 = performance.now(), T = reduceMotion ? 0 : 650;
  S.animating = true;
  const step = now => {
    const p = T ? Math.min(1, (now - t0) / T) : 1, k = ease(p);
    const dk = Math.exp(lerp(Math.log(d0), Math.log(d1), k));
    const v = { start: fix === null ? lerp(from.start, to.start, k) : fix - (fix - from.start) * (dk / d0), [key]: dk };
    if (S.mode === 'spiral') v.N = lerp(from.N, to.N, k);
    S.v = p >= 1 ? { ...to } : v; render();
    if (p < 1) S.raf = requestAnimationFrame(step); else S.animating = false;
  };
  S.raf = requestAnimationFrame(step);
}
function go() { animateTo(targetFor(S.mode, S.level, S.anchor)); syncControls(); updateList(); }
function setLevel(l) { if (l === S.level) return; S.level = clamp(l, 0, 3); S.hover = null; go(); }
function zoomIn(t) { if (S.level >= 3) return; S.anchor = t; S.level++; S.hover = null; go(); }
function zoomOut() { if (S.level <= 0) return; S.level--; S.hover = null; go(); }
function stepBy(dir) {
  const d = new Date(S.anchor);
  S.anchor = [new Date(d.getFullYear() + dir, d.getMonth(), Math.min(d.getDate(), 28)), new Date(d.getFullYear(), d.getMonth() + dir, Math.min(d.getDate(), 28)),
    new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 * dir), new Date(d.getFullYear(), d.getMonth(), d.getDate() + dir)][S.level].getTime();
  go();
}
function setMode(m) {
  if (m === S.mode) return; cancelAnimationFrame(S.raf); S.animating = false;
  S.mode = m; S.v = targetFor(m, S.level, S.anchor); render(); syncControls();
}
function syncControls() {
  document.querySelectorAll('#levels button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.level === S.level)));
  document.getElementById('m-rings').setAttribute('aria-pressed', String(S.mode === 'rings'));
  document.getElementById('m-spiral').setAttribute('aria-pressed', String(S.mode === 'spiral'));
}

/* ---------- Eingabe ---------- */
function svgPt(ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const angOf = p => { let a = Math.atan2(p.x, -p.y); return a < 0 ? a + TAU : a; };

svg.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const p = svgPt(ev);
  S.drag = { last: angOf(p), acc: 0, v0: null, moved: false, x: ev.clientX, y: ev.clientY };
});
svg.addEventListener('pointermove', ev => {
  const p = svgPt(ev), d = S.drag;
  if (d) {
    if (!d.moved && Math.hypot(ev.clientX - d.x, ev.clientY - d.y) > 5) {
      d.moved = true; cancelAnimationFrame(S.raf); S.animating = false; d.v0 = { ...S.v };
      svg.setPointerCapture(ev.pointerId); svg.classList.add('dragging');
    }
    if (d.moved) {
      const a = angOf(p); let da = a - d.last; if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU;
      d.acc += da; d.last = a;
      const span = S.mode === 'rings' ? d.v0.dur : d.v0.P;
      S.v = { ...d.v0, start: d.v0.start - d.acc / TAU * span }; render(); return;
    }
  }
  S.hoverT = S.g.timeAt(p.x, p.y); drawHL();
});
function endDrag(ev, cancelled) {
  const d = S.drag; S.drag = null; svg.classList.remove('dragging');
  if (!d) return;
  if (d.moved) {
    const v = S.v; S.anchor = S.mode === 'rings' ? v.start + v.dur / 2 : v.start + v.N * v.P / 2;
    go(); return;
  }
  if (cancelled) return;
  const p = svgPt(ev), t = S.g.timeAt(p.x, p.y);
  if (t != null) zoomIn(t);
}
svg.addEventListener('pointerup', ev => endDrag(ev, false));
svg.addEventListener('pointercancel', ev => endDrag(ev, true));
svg.addEventListener('pointerleave', () => { if (S.drag?.moved) return; S.hoverT = null; S.hover = null; drawHL(); updateHub(); });
mainL.addEventListener('pointerover', ev => {
  const el = ev.target.closest('[data-i],[data-day],[data-ctx]');
  if (!el) { if (S.hover) { S.hover = null; updateHub(); } return; }
  S.hover = el.dataset.i != null ? { item: ALL[+el.dataset.i] } : el.dataset.day != null ? { day: +el.dataset.day } : { ctx: el.dataset.ctx };
  updateHub();
});
mainL.addEventListener('pointerout', ev => { if (!ev.relatedTarget || !mainL.contains(ev.relatedTarget)) { S.hover = null; updateHub(); } });
svg.addEventListener('wheel', ev => {
  ev.preventDefault(); if (S.animating) return;
  S.wacc += ev.deltaY; if (Math.abs(S.wacc) < 50) return;
  const dir = Math.sign(S.wacc); S.wacc = 0;
  if (dir < 0) { const p = svgPt(ev); const t = S.g.timeAt(p.x, p.y); zoomIn(t ?? S.anchor); } else zoomOut();
}, { passive: false });
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,textarea')) return;
  if (ev.key === 'ArrowLeft') stepBy(-1);
  else if (ev.key === 'ArrowRight') stepBy(1);
  else if (ev.key === '+' || ev.key === '=') zoomIn(S.anchor);
  else if (ev.key === '-' || ev.key === 'Escape') zoomOut();
});
document.getElementById('levels').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLevel(+b.dataset.level); });
document.getElementById('prev').addEventListener('click', () => stepBy(-1));
document.getElementById('next').addEventListener('click', () => stepBy(1));
document.getElementById('today').addEventListener('click', () => { S.anchor = NOW; go(); });
document.getElementById('m-rings').addEventListener('click', () => setMode('rings'));
document.getElementById('m-spiral').addEventListener('click', () => setMode('spiral'));

buildRings();
S.v = targetFor(S.mode, S.level, S.anchor);
render(); syncControls(); updateList();
})();
</script>
