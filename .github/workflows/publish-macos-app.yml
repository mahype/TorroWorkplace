# Builds signed and notarised macOS `.app` bundles for the core and the two GUIs from the binaries that dist already
# put into the GitHub Release, and attaches them to the same release as `<bin>-<arch>-apple-darwin.app.zip`.
# dist itself only ships bare binaries and no `.app` bundles. Background: docs/release.md.
#
# Two ways to run it, both only when the repository variable MACOS_APP_ENABLED is 'true':
#   * automatically after a release: dist calls it as a custom publish job
#     (`publish-jobs = ["./publish-macos-app"]` in dist-workspace.toml);
#   * by hand: Actions -> "Publish macOS app" -> Run workflow, with the tag (e.g. v0.1.0).
#
# Uses the same secrets and the same Developer ID as TorroMail:
#   MACOS_CERTIFICATE_P12         "Developer ID Application" certificate with private key, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   APPLE_ID                      Apple ID of the developer account (notarisation)
#   APPLE_TEAM_ID                 10-character team id
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com (notarisation)

name: Publish macOS app

on:
  workflow_call:
    inputs:
      plan:
        description: JSON plan produced by `dist plan` (passed by release.yml)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the apps to, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write # upload the .app.zip to the release

jobs:
  macos-app:
    name: ${{ matrix.bin }} (${{ matrix.arch }})
    if: ${{ vars.MACOS_APP_ENABLED == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bin: torroworkplace, appid: torro-workplace, title: Torro Workplace, arch: aarch64, runner: macos-14 }
          - { bin: torroworkplace, appid: torro-workplace, title: Torro Workplace, arch: x86_64, runner: macos-15-intel }
          - { bin: torrocalendar, appid: torro-calendar, title: Torro Calendar, arch: aarch64, runner: macos-14 }
          - { bin: torrocalendar, appid: torro-calendar, title: Torro Calendar, arch: x86_64, runner: macos-15-intel }
          - { bin: torrotasks, appid: torro-tasks, title: Torro Tasks, arch: aarch64, runner: macos-14 }
          - { bin: torrotasks, appid: torro-tasks, title: Torro Tasks, arch: x86_64, runner: macos-15-intel }
          # The reminder over the whole screen (task ER2.2): the calendar's binary as an agent app.
          - { bin: torrocalendar, exe: torro-reminder, agent: "1", appid: torro-reminder, title: Torro Reminder, arch: aarch64, runner: macos-14 }
          - { bin: torrocalendar, exe: torro-reminder, agent: "1", appid: torro-reminder, title: Torro Reminder, arch: x86_64, runner: macos-15-intel }
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
      TARGET: ${{ matrix.arch }}-apple-darwin
      APP: out/${{ matrix.title }}.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the released binary
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.bin }}-${TARGET}.tar.xz"
          tar -xf "${{ matrix.bin }}-${TARGET}.tar.xz"

      - name: Build the .app bundle
        run: |
          version="${TAG#v}"
          # Pass a 1024x1024 PNG as the last argument once real artwork exists (packaging/macos/icons/).
          AGENT_APP="${{ matrix.agent }}" packaging/macos/make-app.sh "${{ matrix.exe || matrix.bin }}" \
            "${{ matrix.appid }}" "${{ matrix.title }}" "$version" "${{ matrix.bin }}-${TARGET}/${{ matrix.bin }}" out

      - name: Import the signing certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Prepend our keychain to the search list without dropping the runner's own keychains.
          existing="$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$keychain" $existing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain"
          # Take the identity from the certificate itself, so no secret has to repeat its name.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12" >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          echo "Signing as: $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign (hardened runtime)
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" \
            "$APP/Contents/MacOS/${{ matrix.exe || matrix.bin }}"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarise and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # ditto keeps extended attributes and symlinks; plain zip can break notarisation.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 30m
          # A zip cannot be stapled; staple the bundle, then zip it for the release.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Upload to the release
        run: |
          asset="${{ matrix.exe || matrix.bin }}-${TARGET}.app.zip"
          ditto -c -k --keepParent "$APP" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          gh release upload "$TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber
