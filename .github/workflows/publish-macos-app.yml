# Builds signed/notarised bundles and DMGs BEFORE host publishes. Archives remain for catalog consumers.
# dist itself only ships bare binaries and no `.app` bundles. Background: docs/release.md.
#
# Names and layout must match what the suite looks for (torro_gui::source::bundle_program, issue #279):
# `<title>.app/Contents/MacOS/<bin>` with title = AppId::display_name, bin = AppId::program_file and the bundle id
# io.github.mahype.<appid>, appid = AppId::window_class. Every app bundle except the reminder carries the core's service
# as an agent bundle in Contents/Library/LoginItems (torro_gui::source::SERVICE_PROGRAM, decision 7 in
# docs/lebenszyklus.md; one copy per app since issue #411, so each app runs without the main application). The service
# bundle is the same in every app: bundle id io.github.mahype.torro-workplace-service, signed by the same team, so the
# keychain trusts every copy; the suite starts the copy with the highest TorroVersion (its Info.plist, make-app.sh).
#
# Called only as a global artifact job by the tag-triggered release workflow; never manually.
#
# Uses the same secrets and the same Developer ID as TorroMail:
#   MACOS_CERTIFICATE_P12         "Developer ID Application" certificate with private key, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   APPLE_ID                      Apple ID of the developer account (notarisation)
#   APPLE_TEAM_ID                 10-character team id
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com (notarisation)

name: Publish macOS app

on:
  workflow_call:
    inputs:
      plan:
        description: JSON plan produced by `dist plan` (passed by release.yml)
        required: true
        type: string
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Require macOS signing and notarisation (no unsigned fallback)
        env:
          ENABLED: ${{ vars.MACOS_APP_ENABLED }}
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test "$ENABLED" = true
          test -n "$CERT" && test -n "$PASSWORD" && test -n "$APPLE_ID" && test -n "$TEAM" && test -n "$NOTARY"
  macos-app:
    name: ${{ matrix.bin }} (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `service: "1"` embeds "Torro Workplace Service.app", made from the released torroworkplace binary (started as
          # `daemon`), into every app except the reminder (issue #411). The control centre first.
          - { bin: torroworkplace, service: "1", appid: torro-workplace, title: Torro Workplace, arch: aarch64, runner: macos-14 }
          - { bin: torroworkplace, service: "1", appid: torro-workplace, title: Torro Workplace, arch: x86_64, runner: macos-15-intel }
          # The inbox's three apps (decision 2 in docs/lebenszyklus.md), each a program of its own.
          - { bin: torroinbox, service: "1", appid: torro-inbox, title: Torro Notification Hub, arch: aarch64, runner: macos-14 }
          - { bin: torroinbox, service: "1", appid: torro-inbox, title: Torro Notification Hub, arch: x86_64, runner: macos-15-intel }
          - { bin: torro-inbox-mail, service: "1", appid: torro-inbox-mail, title: Torro Workplace Mail, arch: aarch64, runner: macos-14 }
          - { bin: torro-inbox-mail, service: "1", appid: torro-inbox-mail, title: Torro Workplace Mail, arch: x86_64, runner: macos-15-intel }
          - { bin: torro-inbox-notifications, service: "1", appid: torro-inbox-notifications, title: Torro App Feed, arch: aarch64, runner: macos-14 }
          - { bin: torro-inbox-notifications, service: "1", appid: torro-inbox-notifications, title: Torro App Feed, arch: x86_64, runner: macos-15-intel }
          - { bin: torroassistant, service: "1", appid: torro-assistant, title: Torro Assistant, arch: aarch64, runner: macos-14 }
          - { bin: torroassistant, service: "1", appid: torro-assistant, title: Torro Assistant, arch: x86_64, runner: macos-15-intel }
          - { bin: torrocalendar, service: "1", appid: torro-calendar, title: Torro Calendar, arch: aarch64, runner: macos-14 }
          - { bin: torrocalendar, service: "1", appid: torro-calendar, title: Torro Calendar, arch: x86_64, runner: macos-15-intel }
          - { bin: torrotasks, service: "1", appid: torro-tasks, title: Torro Tasks, arch: aarch64, runner: macos-14 }
          - { bin: torrotasks, service: "1", appid: torro-tasks, title: Torro Tasks, arch: x86_64, runner: macos-15-intel }
          # The reminder over the whole screen (task ER2.2): the calendar's binary as an agent app, without the service
          # (the calendar's bundle carries it).
          # Its icon is the calendar's (packaging/macos/icons/, task AP.7); every other bundle has the icon of its appid.
          - { bin: torrocalendar, exe: torro-reminder, agent: "1", appid: torro-reminder, icon: torro-calendar, title: Torro Reminder, arch: aarch64, runner: macos-14 }
          - { bin: torrocalendar, exe: torro-reminder, agent: "1", appid: torro-reminder, icon: torro-calendar, title: Torro Reminder, arch: x86_64, runner: macos-15-intel }
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      TARGET: ${{ matrix.arch }}-apple-darwin
      APP: out/${{ matrix.title }}.app
      SERVICE: out/${{ matrix.title }}.app/Contents/Library/LoginItems/Torro Workplace Service.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: input
          merge-multiple: true
      - name: Verify and extract build artifacts
        env:
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'packaging')
          import installers
          installers.source_plan(Path('input'), os.environ['TAG'])
          for program in {os.environ['BIN'], 'torroworkplace'}:
              installers.unpack_program(Path('input'), program, os.environ['TARGET'], Path('.'))
          PY

      - name: Build the .app bundle
        run: |
          set -euo pipefail
          version="${TAG#v}"
          binary="${{ matrix.bin }}"
          embed=""
          if [ "${{ matrix.service }}" = "1" ]; then
            # The core's service: an agent bundle without a Dock icon, embedded into this app's bundle. Always the
            # torroworkplace binary and the id torro-workplace-service, whichever app carries it.
            AGENT_APP=1 packaging/macos/make-app.sh torroworkplace torro-workplace-service "Torro Workplace Service" \
              "$version" torroworkplace service packaging/macos/icons/torro-workplace.png
            embed="service/Torro Workplace Service.app"
          fi
          # The icon: a 1024x1024 PNG from packaging/macos/icons/ (task AP.7), made into an .icns by make-app.sh.
          AGENT_APP="${{ matrix.agent }}" EMBED_APP="$embed" packaging/macos/make-app.sh "${{ matrix.exe || matrix.bin }}" \
            "${{ matrix.appid }}" "${{ matrix.title }}" "$version" "$binary" out \
            "packaging/macos/icons/${{ matrix.icon || matrix.appid }}.png"

      - name: Import the signing certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Prepend our keychain to the search list without dropping the runner's own keychains.
          existing="$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$keychain" $existing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain"
          # Take the identity from the certificate itself, so no secret has to repeat its name.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12" >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          echo "Signing as: $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign (hardened runtime)
        run: |
          set -euo pipefail
          # Inside out: the embedded service bundle (its program, then the bundle), then this app's program, then this
          # bundle; the outer signature seals the nested code as it is then.
          if [ "${{ matrix.service }}" = "1" ]; then
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" \
              "$SERVICE/Contents/MacOS/torroworkplace"
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$SERVICE"
          fi
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" \
            "$APP/Contents/MacOS/${{ matrix.exe || matrix.bin }}"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarise and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # One submission per bundle; it covers the embedded service bundle as well.
          # ditto keeps extended attributes and symlinks; plain zip can break notarisation.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 30m
          # A zip cannot be stapled; staple the bundle, then zip it for the release.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Archive the stapled bundle
        run: |
          asset="${{ matrix.exe || matrix.bin }}-${TARGET}.app.zip"
          ditto -c -k --keepParent "$APP" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-bundle-${{ matrix.exe || matrix.bin }}-${{ matrix.arch }}
          path: '*.app.zip*'
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  dmg:
    needs: macos-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-14 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      TARGET: ${{ matrix.arch }}-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-macos-bundle-*-${{ matrix.arch }}
          path: input
          merge-multiple: true
      - name: Verify and unpack signed bundles
        run: |
          python3 - <<'PY'
          import os, stat, sys, zipfile, subprocess
          from pathlib import Path
          sys.path.insert(0, 'packaging')
          import installers
          for archive in Path('input').glob('*.app.zip'):
              installers.checked(archive)
              with zipfile.ZipFile(archive) as zipped:
                  for member in zipped.infolist():
                      installers.safe_name(member.filename)
                      if stat.S_ISLNK(member.external_attr >> 16):
                          raise ValueError('unexpected link in app archive')
              subprocess.run(['ditto', '-x', '-k', str(archive), 'bundles'], check=True)
          PY
      - name: Import Developer ID for images
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          existing="$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$keychain" $existing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build seven signed, notarised and stapled images
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, sys, subprocess
          from pathlib import Path
          sys.path.insert(0, 'packaging')
          import installers
          for app in installers.apps():
              required = [a for a in installers.apps() if a['program'] in app['requires']]
              bundles = [Path('bundles') / (a['title'] + '.app') for a in [app, *required]]
              if app['program'] == 'torrocalendar':
                  bundles.append(Path('bundles/Torro Reminder.app'))
              subprocess.run(['bash', 'packaging/macos/make-dmg.sh', app['program'], installers.version(os.environ['TAG']),
                              os.environ['TARGET'], 'out', *map(str, bundles)], check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-dmg-${{ matrix.arch }}
          path: out/*.dmg*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
