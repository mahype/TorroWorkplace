name: CI

# Runs only for releases or when started by hand: every minute on GitHub Actions is billed, macOS and Windows
# runners many times over. release.yml calls this workflow before it builds anything (dist `plan-jobs`), a failed
# check stops the release. Before each commit and push the same checks run locally (scripts/ci-local.sh, .githooks/).
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Design check (F.6): any raw design value in the apps fails the build (strict since W.5).
      - name: Design check self-test
        shell: bash
        run: scripts/design-check.sh --self-test
      - name: Design check
        shell: bash
        run: scripts/design-check.sh --strict
      - run: cargo test --workspace
