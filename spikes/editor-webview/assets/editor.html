<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>editor-webview</title>
<style>
  html, body { height: 100%; margin: 0; font: 15px/1.45 sans-serif; background: #fff; color: #111; }
  body { display: flex; flex-direction: column; }
  #bar { padding: 6px; border-bottom: 1px solid #ccc; display: flex; gap: 6px; flex: none; }
  #bar button { font: inherit; padding: 2px 10px; }
  #editor { flex: 1; overflow: auto; padding: 12px; outline: none; min-height: 0; }
  #editor img { max-width: 160px; }
  #editor blockquote { margin: 4px 0 4px 8px; padding-left: 10px; border-left: 3px solid #999; }
  #log { flex: none; height: 110px; overflow: auto; margin: 0; padding: 6px; background: #f3f3f3;
         border-top: 1px solid #ccc; font: 12px/1.3 monospace; white-space: pre-wrap; }
  #editor.over { background: #eef6ff; }
</style>
</head>
<body>
<div id="bar">
  <button data-cmd="bold"><b>B</b></button>
  <button data-cmd="italic"><i>I</i></button>
  <button data-cmd="list">• Liste</button>
  <button data-cmd="quote">Zitat</button>
  <button data-cmd="undo">Rückgängig</button>
  <button data-cmd="redo">Wiederholen</button>
</div>
<div id="editor"></div>
<pre id="log"></pre>
<script>window.onerror = (m, src, l, c) => window.ipc.postMessage(JSON.stringify({ kind: "js-error", m: String(m), src, l, c }));</script>
<script src="purify.min.js"></script>
<script src="squire.js"></script>
<script src="editor.js"></script>
</body>
</html>
