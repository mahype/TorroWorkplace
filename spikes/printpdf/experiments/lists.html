<html><head><style>body { font-family: "Inter-Regular"; font-size: 11pt; } ul, ol { padding-left: 16pt; } blockquote { border-left: 2pt solid #999999; padding-left: 8pt; }</style></head><body>
<p>A: tight item with nested list</p>
<ol><li>Beratung
<ul><li>Analyse</li></ul></li><li>Umsetzung</li></ol>
<p>B: inline wrapped in span</p>
<ol><li><span>Beratung</span><ul><li>Analyse</li></ul></li><li>Umsetzung</li></ol>
<p>C: inline wrapped in div</p>
<ol><li><div>Beratung</div><ul><li>Analyse</li></ul></li><li>Umsetzung</li></ol>
<p>D: loose with p</p>
<ol><li><p>Beratung</p><ul><li><p>Analyse</p></li></ul></li><li><p>Umsetzung</p></li></ol>
<blockquote><p>Zitat</p></blockquote>
<p>Link <a href="https://torro.example">torro</a></p>
</body></html>
