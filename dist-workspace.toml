[workspace]
members = ["cargo:."]

# Config for `dist` (https://github.com/axodotdev/cargo-dist). Background: docs/release.md.
[dist]
# The dist version that generated .github/workflows/release.yml. Upgrade with `dist init`.
cargo-dist-version = "0.32.0"
# CI backend to use
ci = "github"
# Installers to generate for the release. Pure Rust, no system libraries needed at build time.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for. Linux uses gnu (not musl): the Iced GUIs dlopen
# libwayland, libxkbcommon, libvulkan and libEGL at runtime, which a static musl binary cannot do.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Homebrew tap that receives one formula per app. The repository does not exist yet.
# tap = "mahype/homebrew-torro"
# Publish the formulae to the tap after the GitHub Release is created.
# Needs the secret HOMEBREW_TAP_TOKEN and the existing tap repository.
# publish-jobs = ["homebrew"]
# Signed and notarised .app bundles for macOS (.github/workflows/publish-macos-app.yml). Needs the
# signing secrets and the repository variable MACOS_APP_ENABLED=true, see docs/release.md.
publish-jobs = ["./publish-macos-app"]
# Before anything is built: clippy, design check and tests on Linux, macOS and Windows (.github/workflows/ci.yml).
# A failing check stops the release.
plan-jobs = ["./ci"]
# release.yml carries one hand edit: the `host` job also needs `custom-ci`, otherwise a failed check would skip the
# builds but `host` (if: always()) would still create the release. After `dist generate` re-apply it.
allow-dirty = ["ci"]
# Where the shell and PowerShell installers put the binaries.
install-path = "CARGO_HOME"
# No self-updater: updates go through the package managers.
install-updater = false
# Pull requests start no workflow at all: GitHub Actions costs money, checks run locally (scripts/ci-local.sh).
pr-run-mode = "skip"

# The macOS job downloads the released binaries and uploads the .app bundles, so it needs write access to
# the release contents (a called workflow cannot have more rights than its caller grants).
[dist.github-custom-job-permissions]
"publish-macos-app" = { contents = "write" }

# System packages the Linux builds need (torromailview, task M9.2: wry draws with WebKitGTK in a GTK
# window). dist installs them with apt before building; macOS and Windows use the system web view.
[dist.dependencies.apt]
# Quoted: a bare key would split at the dot.
"libwebkit2gtk-4.1-dev" = "*"
libgtk-3-dev = "*"
