# macOS: `cargo run` signs what it starts with the development identity "Torro Development", so the
# keychain keeps "Always Allow" across builds (task X.14, scripts/macos-dev-run.sh). Without the
# identity the runner only starts the program.
[target.aarch64-apple-darwin]
runner = "scripts/macos-dev-run.sh"

[target.x86_64-apple-darwin]
runner = "scripts/macos-dev-run.sh"

# Every test thread (and a debug `cargo run`) gets 8 MiB of stack: in a debug build, where no frame is
# shrunk, a command that waits for approval runs through the core twice and nests deeper than the
# 2 MiB of a test thread hold (issue #643; several core tests overflowed on main already).
[env]
RUST_MIN_STACK = "8388608"
